name: 毎日 20:00頃　公式コメント欄を読み解く（長編）

# ずんだもんと四国めたんの対話で、3分の通常動画を作る。
#
# 夕方の4本が終わったあとに走る。材料(ハイライトとコメント欄)は
# こちらで取り直すので、前の枠からファイルを受け取る必要は無い。
#
# **手で押したときは非公開(private)、日次で走ったときは公開(public)。**
# 試作のあいだは見てから決めていたが、5本作って画面・音・台本の
# 直しが出揃ったので、日次の枠として確立する。
#
# ショートとは出る面が違う(フィード vs 検索・関連)。
# 同じ日に出しても、短編7本と食い合わない。

on:
  workflow_dispatch:
    inputs:
      privacy:
        description: '公開設定 (private / unlisted / public)'
        required: false
        default: 'private'
      upload:
        description: 'YouTubeへ上げるか (false なら動画ファイルだけ作る)'
        required: false
        default: 'true'
  workflow_run:
    workflows: ["毎日 17:00-20:00　夕方の4本"]
    types: [completed]

# 投稿の記録を書き戻すので write が要る。
#
# read のままだったので、長編を5本上げても
# published_videos.json に1件も残っていなかった。
# 記録が無いと、健康診断も導線もこの枠を見つけられない。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 前の枠が落ちた日は、材料が揃っていない可能性がある。
    # ただし長編は材料を取り直すので、落ちていても作れることはある。
    # 「成功したときだけ」にしておく。取りこぼしは watchdog が拾う。
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      - name: Install video tools
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh

      # 短編と同じ起動の仕方。ここは continue-on-error にしない。
      # 対話は音が全てなので、無音で出しても意味が無い。
      - name: Start VOICEVOX engine
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox             voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      # 材料は取り直さない。**夕方の枠がコミットしたものを使う。**
      #
      # 取り直していたが、それだと18:00の「ファンのコメント欄」と
      # 20:30の長編で、別の試合になりうる。
      # 短編の説明欄には「この試合のコメント欄をもっと詳しく」と
      # 書いて長編へ繋いでいるので、違う試合だとそれが嘘になる。
      #
      # ついでにYouTubeの枠とAnthropicの呼び出しが1回ずつ減る。
      - name: Check the material is today's
        run: |
          python - <<'PY'
          import json, pathlib
          from datetime import datetime, timezone, timedelta
          today = datetime.now(timezone(timedelta(hours=9))).date().isoformat()
          for name in ("data/mlb_buzz.json", "data/local_voices.json"):
              try:
                  d = json.loads(pathlib.Path(name).read_text(encoding="utf-8"))
              except Exception as e:
                  print("::warning::%s を読めません(%s)" % (name, e))
                  continue
              at = str(d.get("updated_at") or "")[:10]
              mark = "" if at == today else "  ← 今日のものではありません"
              print("%-26s %s%s" % (name, at or "(日付なし)", mark))
          PY

      - name: Write the dialogue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p build/lf
          python scripts/generate_dialogue.py --out build/lf/dialogue.json

      # 台本にありえない数字が混ざっていないか。短編と同じ検査を通す。
      # 長編だからといって緩めない。
      - name: Sanity check the script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/sanity.py --general --strict \
            --narration build/lf/dialogue.json \
            --out data/sanity_longform.json

      - name: Synthesize both voices
        run: |
          python scripts/synthesize_narration.py \
            --narration build/lf/dialogue.json \
            --out-dir build/lf/audio

      - name: Build the video
        run: |
          python scripts/generate_longform.py \
            --dialogue build/lf/dialogue.json \
            --audio-dir build/lf/audio \
            --out build/lf --require-audio

      - name: Thumbnail
        continue-on-error: true
        run: |
          TOPIC=$(python -c "import json;print(json.load(open('build/lf/dialogue.json',encoding='utf-8')).get('top',''))" || echo "")
          python scripts/generate_thumbnail.py \
            --kind longform --topic "$TOPIC" \
            --dialogue build/lf/dialogue.json \
            --out build/lf/thumb.png

      # 動画は必ず artifact に残す。上げなくても手元で見られるように。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: longform
          path: |
            build/lf/collespo_longform.mp4
            build/lf/dialogue.json
            build/lf/thumb.png
          if-no-files-found: warn

      - name: Upload to YouTube
        if: ${{ inputs.upload != 'false' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          TOPIC=$(python -c "import json;print(json.load(open('build/lf/dialogue.json',encoding='utf-8')).get('top',''))")
          python scripts/upload_youtube.py \
            --video build/lf/collespo_longform.mp4 \
            --kind longform --topic "$TOPIC" \
            --dialogue build/lf/dialogue.json \
            --thumbnail build/lf/thumb.png \
            --privacy "${{ inputs.privacy || 'public' }}"

      # 投稿の記録を残す。ここが無いと、上げたこと自体が
      # ランナーの中で消える。
      - name: Commit the record
        if: ${{ inputs.upload != 'false' }}
        continue-on-error: true
        run: |
          bash scripts/commit_data.sh \
            "longform: ${{ github.run_id }}" \
            data/published_videos.json data/token_usage.json

      - name: Say what happened
        if: always()
        run: |
          {
            echo "## 長編（試作）"
            echo
            if [ -f build/lf/collespo_longform.mp4 ]; then
              echo "- 動画: $(du -h build/lf/collespo_longform.mp4 | cut -f1)"
            else
              echo "- **動画は作れませんでした**"
            fi
            echo "- 公開設定: ${{ inputs.privacy || 'public' }}"
            python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          try:
              import token_log, generate_dialogue as gd
              print("- 台本のモデル: `%s`" % gd.MODEL)
              print("- " + token_log.summary_line("dialogue"))
              s = token_log.summary()
              print("- 今日のAPI代 $%.4f / 直近%d日の平均 $%.4f（月 $%.2f）"
                    % (token_log.spent_today(), s.get("days", 0),
                       s.get("avg_usd", 0), s.get("month_usd", 0)))
          except Exception as e:
              print("- (費用を読めません: %s)" % e)
          PY
            echo
            echo "### 台本"
            echo
            echo '```'
            python - <<'PY'
          import json, pathlib
          try:
              d = json.loads(pathlib.Path("build/lf/dialogue.json").read_text(encoding="utf-8"))
              for s in d.get("segments", []):
                  print("%s：%s" % ((s.get("meta") or {}).get("who", "?"), s.get("text", "")))
          except Exception as e:
              print("(台本を読めません: %s)" % e)
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
