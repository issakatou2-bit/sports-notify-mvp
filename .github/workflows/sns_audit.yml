name: SNS read-only audit
on:
  schedule:
    - cron: '0 21 * * *' # 06:00 JST; GitHub scheduling may be delayed
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sns-readonly-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline synthetic regression tests
        run: python -m unittest discover -s scripts -p test_social_audit.py -v
      - name: Read delivery ledger (do not create or write the state branch)
        uses: actions/checkout@v4
        with:
          ref: codex/buffer-state
          path: ledger-state
          persist-credentials: false
          sparse-checkout: data/buffer_delivery.json
          sparse-checkout-cone-mode: false
      - name: Read queued and recently sent posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: >-
          python scripts/social_audit.py --live
          --ledger ledger-state/data/buffer_delivery.json
          --published data/published_videos.json
