name: 毎朝9:30 状況とアナリティクス
on:
  schedule:
    - cron: '30 0 * * *' # 9:30 JST（Actionsの混雑で遅れる場合あり）
  workflow_dispatch:

permissions:
  contents: write # docs/statusの日付報告だけを保存
  actions: read

concurrency:
  group: morning-status-report
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 状況と保存済みアナリティクスを1枚にする
        id: make_report
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/morning_report.py
      - name: 報告だけをコミットして保存
        # API取得を別途増やさず、既存healthcheckのanalyticsを読む。
        env:
          REPORT_FILE: ${{ steps.make_report.outputs.report_path }}
        run: |
          set -euo pipefail
          FILE="$REPORT_FILE"
          [[ "$FILE" =~ ^docs/status/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$ ]]
          DAY=$(basename "$FILE" .md)
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "morning status: $DAY"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep "$((attempt * 3))"
          done
          echo '::error::朝の報告を保存できませんでした（実行要約を参照）'
          exit 1
