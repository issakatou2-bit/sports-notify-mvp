name: 道具　公開を止める / 戻す

# 出したあとに中身の誤りが分かった日に、公開を止める。
#
# 9/8、18:30公開予定の長編に「カブスは20本以上が5人」と入っていた。
# 正しくは4人。移籍した選手の成績を二重に数えていたため。
# 公開の1時間前に気づけたのに、止める道具が無かった。
#
# 消さない。非公開に戻すだけなので、取り違えてもすぐ戻せる。
# 既定は下読み。実行ページに「いま」と「こう」を出すので、
# 見てから write: true でもう一度動かす。

on:
  workflow_dispatch:
    inputs:
      video:
        description: '動画ID (例 7VMEC9txt0k)'
        required: true
      write:
        description: 'true にすると実際に変える(既定は下読みだけ)'
        required: false
        default: 'false'
      release:
        description: 'true にすると、逆に公開へ戻す'
        required: false
        default: 'false'
      publish_at:
        description: '確認済み非公開動画だけを予約（例2026-10-04T21:00:00+09:00、空なら従来動作）'
        required: false

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-api-python-client google-auth

      - name: Hold or release
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          VIDEO_ID: ${{ inputs.video }}
          WRITE: ${{ inputs.write }}
          RELEASE: ${{ inputs.release }}
          PUBLISH_AT: ${{ inputs.publish_at }}
        run: |
          set -euo pipefail
          ARGS=(--video "$VIDEO_ID")
          if [ "$WRITE" = "true" ]; then ARGS+=(--write); fi
          if [ "$RELEASE" = "true" ]; then ARGS+=(--release); fi
          if [ -n "$PUBLISH_AT" ]; then ARGS+=(--publish-at "$PUBLISH_AT"); fi
          python scripts/hold_video.py "${ARGS[@]}" | tee "$GITHUB_STEP_SUMMARY"
