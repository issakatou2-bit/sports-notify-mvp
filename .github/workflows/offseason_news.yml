name: MLB オフの公式話題

on:
  workflow_run:
    workflows: ["毎日 17:00-20:00　夕方の4本"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: mlb-player-publication
  cancel-in-progress: false
env:
  COLLESPO_OFFSEASON_NEWS: ${{ vars.COLLESPO_OFFSEASON_NEWS || '' }}
  COLLESPO_SHORT_LOOK: ${{ vars.COLLESPO_SHORT_LOOK || 'v4' }}
  COLLESPO_SOLO_HOST: ${{ vars.COLLESPO_SOLO_HOST || 'metan' }}
  COLLESPO_HOST_SPLIT: ${{ vars.COLLESPO_HOST_SPLIT || '' }}
  COLLESPO_UI_VOICE_STOCK: ${{ vars.COLLESPO_UI_VOICE_STOCK || '' }}
  COLLESPO_UI_PARTS_KEY: ${{ secrets.COLLESPO_UI_PARTS_KEY }}
  COLLESPO_HOOK_AB: ${{ vars.COLLESPO_HOOK_AB || '' }}
  COLLESPO_BUBBLE: ${{ vars.COLLESPO_BUBBLE || '' }}
  COLLESPO_MOTION: ${{ vars.COLLESPO_MOTION || '' }}
  COLLESPO_CAPTION_BREAKS: ${{ vars.COLLESPO_CAPTION_BREAKS || '' }}
  COLLESPO_SLANT_VARIANT: ${{ vars.COLLESPO_SLANT_VARIANT || 'cream' }}
  COLLESPO_GLASS_BACKGROUND: ${{ vars.COLLESPO_GLASS_BACKGROUND || 'stripes' }}
  COLLESPO_MLB_BADGE: ${{ vars.COLLESPO_MLB_BADGE || '' }}
jobs:
  news:
    if: >-
      github.ref == 'refs/heads/main' && vars.COLLESPO_OFFSEASON_NEWS == 'on' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh publication ledgers
        run: python scripts/player_publications.py --sync
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt pillow google-api-python-client google-auth
      - name: Collect official material
        run: python scripts/offseason_news.py
      - name: Pick fresh unposted material
        id: pick
        run: |
          T="$(python scripts/offseason_news.py --pick)"
          echo "topics=$(echo "$T" | xargs)" >> "$GITHUB_OUTPUT"
      - name: Install video tools
        if: steps.pick.outputs.topics != ''
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh
      - name: Start VOICEVOX
        if: steps.pick.outputs.topics != ''
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:50021/version; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Check, render and publish through existing asset pipeline
        if: steps.pick.outputs.topics != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          source scripts/asset_publish_args.sh
          set -- 22:00 23:00 23:30
          for t in ${{ steps.pick.outputs.topics }}; do
            AT="$1"; shift
            asset_publication_args public "$AT"
            python scripts/generate_asset_video.py --topic "$t" --publish-at "$AT" --narration-out "build/narr_$t.json"
            python scripts/sanity.py --general --strict --narration "build/narr_$t.json" --out "data/sanity_$t.json" --hold-record "build/sanity_hold_$t.json" --kind asset
            python scripts/synthesize_narration.py --narration "build/narr_$t.json" --out-dir "build/audio_$t"
            python scripts/generate_asset_video.py --topic "$t" --narration "build/narr_$t.json" --audio-dir "build/audio_$t" --out "build/asset_$t"
            bash scripts/shorts_thumbnail.sh "build/asset_$t/collespo_asset_$t.mp4" "build/asset_$t/short.png"
            python scripts/upload_youtube.py --video "build/asset_$t/collespo_asset_$t.mp4" --kind asset --asset-topic "$t" --narration "build/narr_$t.json" --thumbnail "build/asset_$t/short.png" --privacy public "${ASSET_PUBLISH_ARGS[@]}"
            python scripts/offseason_news.py --record "$t"
            python scripts/asset_sns.py --receipt-dir "build/asset_$t"
          done
      - name: Save records
        if: always()
        run: |
          bash scripts/commit_data.sh "offseason news: ${{ github.run_id }}" data/offseason_topics.json data/offseason_published.json data/published_assets.json data/published_videos.json
      - name: Keep verification and video artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offseason-news
          path: |
            data/offseason*.json
            data/sanity_offseason*.json
            build/sanity_hold_offseason*.json
            build/narr_offseason*.json
            build/asset_offseason*/
            build/audio_offseason*/voice_manifest.json
            build/**/voice_manifest.json
            build/**/render_timeline.json
            !build/**/portrait/**
          retention-days: 14
      - name: Save sanity gate records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-gate-${{ github.job }}
          path: |
            data/sanity_offseason*.json
            build/sanity_hold_offseason*.json
            !build/**/portrait/**
          retention-days: 14
      - name: Keep unsaved data records
        if: always() && hashFiles('build/data-save-recovery/**/FAILED') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-data-${{ github.job }}-${{ github.run_attempt }}
          path: |
            build/data-save-recovery/
            !build/**/portrait/**
          retention-days: 14
          if-no-files-found: error
      - name: Save quota-exceeded thumbnails
        if: always() && hashFiles('build/thumbnail_pending/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-pending
          path: |
            build/thumbnail_pending/
            !build/**/portrait/**
          retention-days: 3
          if-no-files-found: error
