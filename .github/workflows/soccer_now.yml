name: サッカー試合直後の速報（既定は非公開）
on:
  schedule:
    - cron: '7 * * * *'  # 粗い入口24回。試合終盤だけ各回50分以内・5分間隔。
  workflow_dispatch:
    inputs:
      sample_only:
        description: 見本のmp4だけを保存する（公開・SNS・台帳・コミット・通知なし）
        type: boolean
        required: false
        default: false
permissions:
  contents: write
concurrency:
  group: soccer-flash
  cancel-in-progress: false
env:
  COLLESPO_SAMPLE_ONLY: ${{ inputs.sample_only && 'true' || 'false' }}
  COLLESPO_SOCCER_LOOK: ${{ vars.COLLESPO_SOCCER_LOOK || 'v6' }}
  COLLESPO_SOCCER_FOCUS: ${{ vars.COLLESPO_SOCCER_FOCUS == 'on' && 'on' || 'off' }}
  COLLESPO_HOST_SPLIT: ${{ vars.COLLESPO_HOST_SPLIT || '' }}
  COLLESPO_UI_VOICE_STOCK: ${{ vars.COLLESPO_UI_VOICE_STOCK || '' }}
  COLLESPO_UI_PARTS_KEY: ${{ secrets.COLLESPO_UI_PARTS_KEY }}
  COLLESPO_UI_VOICE_WAIT_MINUTES: ${{ vars.COLLESPO_UI_VOICE_WAIT_MINUTES || '15' }}
  COLLESPO_MOTION: ${{ vars.COLLESPO_MOTION || '' }}
  COLLESPO_BUBBLE: ${{ vars.COLLESPO_BUBBLE || '' }}
  COLLESPO_CAPTION_BREAKS: ${{ vars.COLLESPO_CAPTION_BREAKS || '' }}
  COLLESPO_GLASS_BACKGROUND: ${{ vars.COLLESPO_GLASS_BACKGROUND || 'stripes' }}
  COLLESPO_SLANT_VARIANT: ${{ vars.COLLESPO_SLANT_VARIANT || 'cream' }}

jobs:
  watch:
    if: inputs.sample_only || (vars.COLLESPO_SOCCER_NOW == 'on')
    runs-on: ubuntu-latest
    timeout-minutes: ${{ vars.COLLESPO_HOST_SPLIT == 'half' && 90 || 70 }}
    env:
      COLLESPO_SOCCER_NOW: ${{ vars.COLLESPO_SOCCER_NOW || 'off' }}
      SOCCER_NOW_PUBLISH: ${{ vars.SOCCER_NOW_PUBLISH || 'false' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh shared match publication ledger
        if: (github.event_name != 'workflow_dispatch' || inputs.sample_only != true)
        run: python scripts/soccer_publications.py --sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install imageio_ffmpeg
      - name: Check for relevant matches before starting video tools
        id: plan
        run: |
          if [ "$COLLESPO_SAMPLE_ONLY" = true ]; then echo "go=1" >> "$GITHUB_OUTPUT"; else python scripts/soccer_now.py --plan | tail -1 >> "$GITHUB_OUTPUT"; fi
      - name: Start VOICEVOX
        if: steps.plan.outputs.go == '1'
        run: |
          docker run -d --rm -p 50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Watch only match windows
        if: steps.plan.outputs.go == '1'
        run: |
          if [ "$COLLESPO_SAMPLE_ONLY" = true ]; then
            python scripts/soccer_now.py --sample --out build/soccer-now
          else
            python scripts/soccer_now.py --watch --out build/soccer-now
          fi
      - name: Keep review material
        if: (github.event_name != 'workflow_dispatch' || inputs.sample_only != true) && (always())
        uses: actions/upload-artifact@v4
        with:
          name: soccer-now-${{ github.run_id }}
          path: |
            build/soccer-now/
            !build/**/portrait/**
          retention-days: 7

      - name: Save quota-exceeded thumbnails
        if: (github.event_name != 'workflow_dispatch' || inputs.sample_only != true) && (always() && hashFiles('build/thumbnail_pending/**') != '')
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-pending
          path: |
            build/thumbnail_pending/
            !build/**/portrait/**
          retention-days: 3
          if-no-files-found: ignore

      - name: Mark sample-only execution
        if: always() && inputs.sample_only
        run: python scripts/sample_only.py --mark build/sample_only.json --require-video
      - name: Save sample video
        if: always() && inputs.sample_only
        uses: actions/upload-artifact@v4
        with:
          name: sample-soccer_now
          path: |
            build/sample_only.json
            build/**/*.mp4
            build/**/audio_mix.json
            !build/**/portrait/**
          if-no-files-found: error
          retention-days: 7
