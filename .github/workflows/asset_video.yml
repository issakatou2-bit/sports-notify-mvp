name: 毎日 夜　資産動画(時刻は決めていません)

# 日付に依存しない「資産動画」を作ってYouTubeへ投稿する。
#
# 日次・週次と分けている理由:
#   内容が日付に依存しないので、決まった時刻に出す必要が無い。
#   作りたいときに手で回す方が、毎日のパイプラインを重くせずに済む。
#
# 既定では限定公開(unlisted)で上げる。
# 資産動画は一度公開すると長く残るため、内容を確認してから
# YouTube側で公開へ切り替える運用にしている。
# 確認済みのトピックを作り直すときだけ public を選ぶ。

on:
  # 毎日1本ずつ出す。
  #
  # なぜ定期にしたのか:
  #   資産動画は実測で維持率76.3%、日次(29〜46%)の倍以上まで見られている。
  #   見られれば最後まで見られるのに、手で回す運用だったので24本を
  #   出し切ったところで止まっていた。いちばんよく見られる種類が
  #   いちばん出ていない状態だった。
  #
  #   球場・球団まとめは10/26に停止。選択対象がなければ本数を補充しない。
  #
  # 起動は cron-job.org から(13:00 UTC = JST 22:00)。
  #
  #   純正の schedule を使っていて、8/12から8/18まで7日間1本も
  #   出ていなかった。玉は79本のうち53本が未投稿で、素材切れではない。
  #   純正は遅れるだけでなく、実行そのものを飛ばす。
  #   しかも診断が日次の7枠しか見ておらず、7日空いても「問題なし」だった。
  # **2026-09-15に、夕方の枠のあとにも走らせるようにした。**
  #
  # 22:00起動のままだと、公開も22:00になる。「22時に出しても
  # しょうがない」というのがユーザーの判断で、17:00から21:00の
  # 30分刻みに全部を収めることにした。18:30に公開するには
  # その前に作り終えている必要があるので、夕方の枠に乗る。
  #
  # cron-job.orgの22:00も残るが、next_asset.py が「きょうはもう
  # 1本出している」で止めるので、1日2本にはならない。
  workflow_run:
    workflows: ["毎日 17:00-20:00　夕方の4本"]
    types: [completed]
  workflow_dispatch:
    inputs:
      topic:
        description: 'トピック名。next で未投稿から1本'
        type: string
        default: next
      privacy:
        description: 公開設定
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public
      force:
        description: 投稿済みのトピックも上げ直す(通常はオフ)
        type: boolean
        default: false

# 投稿済みの記録(data/published_assets.json)をコミットして残すため、
# 書き込み権限が要る。これが無いと毎回まっさらな状態から判断することになり、
# 同じ資産動画を何度も投稿してしまう。
concurrency:
  group: mlb-player-publication
  cancel-in-progress: false

permissions:
  contents: write

# ショートの見た目（v4 は字幕・大きめの立ち絵・進み具合の線）。review_render_v3.LOOK
env:
  COLLESPO_HOOK_AB: ${{ vars.COLLESPO_HOOK_AB || '' }}
  COLLESPO_SOLO_HOST: ${{ vars.COLLESPO_SOLO_HOST || 'metan' }}
  COLLESPO_HOST_SPLIT: ${{ vars.COLLESPO_HOST_SPLIT || '' }}
  COLLESPO_UI_PARTS_KEY: ${{ secrets.COLLESPO_UI_PARTS_KEY }}
  COLLESPO_UI_VOICE_WAIT_MINUTES: ${{ vars.COLLESPO_UI_VOICE_WAIT_MINUTES || '15' }}
  # 選手ごとのシリーズの題（本人OK後にリポジトリ変数 SERIES_TITLE=1）
  SERIES_TITLE: ${{ vars.SERIES_TITLE }}
  COLLESPO_BUBBLE: ${{ vars.COLLESPO_BUBBLE || '' }}
  COLLESPO_MOTION: ${{ vars.COLLESPO_MOTION || '' }}
  COLLESPO_CAPTION_BREAKS: ${{ vars.COLLESPO_CAPTION_BREAKS || '' }}
  COLLESPO_SLANT_VARIANT: ${{ vars.COLLESPO_SLANT_VARIANT || 'cream' }}
  COLLESPO_GLASS_BACKGROUND: ${{ vars.COLLESPO_GLASS_BACKGROUND || 'stripes' }}
  COLLESPO_SHORT_LOOK: ${{ vars.COLLESPO_SHORT_LOOK || 'v3' }}
  COLLESPO_MLB_BADGE: ${{ vars.COLLESPO_MLB_BADGE || '' }}
  COLLESPO_DUO: ${{ vars.COLLESPO_DUO || 'off' }}
  COLLESPO_EXPR: ${{ vars.COLLESPO_EXPR || '' }}
  COLLESPO_LIPSYNC: ${{ vars.COLLESPO_LIPSYNC || '' }}

jobs:
  # 夜の補完は、その日の1本が既にできていることが多い。
  # その場合は全季の試合・順位表の取得や動画用環境の準備を始めない。
  # 在庫はここでは調べず、制作する日に最新材料から選び直す。
  daily_limit:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.limit.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh both MLB player publication ledgers
        run: python scripts/player_publications.py --sync
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional UI stock dependencies
        # 既定のめたんでは、早期確認の前に依存インストールを増やさない。
        if: vars.COLLESPO_SOLO_HOST == 'ui'
        run: pip install -r scripts/requirements.txt
      - name: Check daily limit before fetching materials
        id: limit
        env:
          REQUESTED_TOPIC: ${{ inputs.topic }}
        run: python scripts/next_asset.py --check-daily-limit --requested-topic "$REQUESTED_TOPIC"

  asset:
    needs: daily_limit
    if: needs.daily_limit.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh both MLB player publication ledgers
        run: python scripts/player_publications.py --sync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      # aptが応答しなくなる事象が実行#2と#5で起きたため、
      # リトライとミラー切り替えを持つスクリプトへ切り出した。
      - name: Install video tools
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh

      # 球場の回で使う実測値。その年の全試合から集計するので、
      # 作るたびに最新の数字になる。取得できなくても、
      # 実測の項目が入らないだけで動画自体は作れる。
      # 球場ごとのトピックを公式APIから作る。手書きの在庫が尽きても、
      # ここが玉を供給し続ける。取れなければ手書きのぶんだけで動く。
      - name: Build venue topics
        continue-on-error: true
        run: python scripts/venue_topics.py --out data/venue_topics.json

      # 球団のぶんも同じ形で作る。球団は移転するので、手書きの表より
      # APIを見ている方が正しい(2026年のアスレチックスはサクラメント)。
      - name: Build team topics
        continue-on-error: true
        run: python scripts/team_topics.py --out data/team_topics.json

      - name: Fetch venue stats
        continue-on-error: true
        run: python scripts/venue_stats.py --out data/venue_stats.json

      # ワールドシリーズの球団史・日程。日程が無い季節は空の topics を書いて
      # 正常終了するので、年じゅうこの段を置いておける。
      - name: Build World Series topics
        continue-on-error: true
        run: python scripts/ws_topics.py --out data/ws_topics.json

      # サッカーの開幕日程・昨季順位。soccer_opening と soccer_last_season が
      # これを読む。取れなければその2トピックだけが作られず、他は通る。
      # 開幕日程も昨季順位もAPIから取るので、こちらで書き起こす部分は無い。
      - name: Fetch soccer preview
        continue-on-error: true
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/soccer_preview.py --out data/soccer_preview.json

      # 名前のある指標から在庫を作る。
      #
      # 用語(平均8再生)・球場(4再生)・NPB(4再生)を止めたら、残りが
      # 3件になった。毎日1本出しているので3日で尽きる。
      # rarity.py が毎日出している順位を、常緑ものに組み直す。
      - name: Build topics from the season's standings
        continue-on-error: true
        run: |
          python scripts/rarity.py --out data/rarity.json || true
          python scripts/rare_topics.py | tee -a "$GITHUB_STEP_SUMMARY"
          # 球団ごとの殿堂入り選手。team_legends.json に通算成績つきで
          # 入っていたのに、どこにも使われていなかった（27球団ぶん）。
          python scripts/legend_topics.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Start VOICEVOX engine
        continue-on-error: true
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox \
            voicevox/voicevox_engine:cpu-latest || \
            echo "::warning::VOICEVOXの起動に失敗しました。音声なしで進めます"
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      # 原稿は球団テーブルから機械的に組み立てるだけなので、
      # AIも外部APIも使わない(コストゼロ・内容は毎回同じ)。
      #
      # topic に all を選ぶと、全トピックを順に作って投稿する。
      # ただしYouTube Data APIの1日あたりの割り当ては10,000ユニットで、
      # 動画1本のアップロードが1,600、サムネイル設定が50かかる。
      # つまり1日あたり約6本が上限で、7本目は必ず割り当て超過で失敗する。
      # 途中で失敗しても残りを試し、最後に結果をまとめて出す。
      - name: Build and upload topics
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PRIVACY: ${{ inputs.privacy }}
        run: |
          TOPICS="${{ inputs.topic }}"
          # 定期実行では inputs が空になる。未投稿から1本を既定にする。
          if [ -z "$TOPICS" ]; then TOPICS="next"; fi
          if [ "$TOPICS" = "next" ]; then
            TOPICS="$(python scripts/next_asset.py)"
            if [ -z "$TOPICS" ]; then
              # 理由は2つある。**どちらも異常ではない。**
              #   ・きょうはもう1本出した（22:00のcronと夕方の枠の両方から
              #     起動するので、後から来たほうはここで止まる）
              #   ・在庫が尽きた
              # 理由は next_asset.py が標準エラーに書いている。
              echo "::notice::きょうは作りません（すでに1本出したか、在庫切れ）"
              exit 0
            fi
            echo "::notice::今日の資産動画: $TOPICS"
          fi
          TOPICS="$(python scripts/asset_policy.py "$TOPICS")"
          if [ -z "$TOPICS" ]; then
            echo "::notice::選択対象は停止中です。きょうは補充しません"
            exit 0
          fi
          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE="--force"
            echo "::warning::投稿済みのトピックも上げ直します"
          fi

          # 1本が失敗しても残りを試す。ここを素通しにしていたため、
          # jp_players の不具合1件で以降のトピックが丸ごと未処理になった。
          source scripts/asset_publish_args.sh
          set +e
          FAILED=""
          for t in $TOPICS; do
            echo "::group::$t"

            python scripts/generate_asset_video.py \
              --topic "$t" --publish-at '18:30' --narration-out "build/narr_$t.json"
            if [ $? -ne 0 ]; then
              echo "::warning::$t の原稿生成に失敗しました"
              FAILED="$FAILED $t(原稿)"
              echo "::endgroup::"; continue
            fi

            if ! python scripts/sanity.py --general --strict --narration "build/narr_$t.json" --out "data/sanity_${t}.json" --hold-record "build/sanity_hold_${t}.json" --kind asset; then
              FAILED="$FAILED $t(点検)"
              echo "::endgroup::"; continue
            fi

            # VOICEVOXが落ちていても無音で作れるよう、ここは失敗を許容する
            python scripts/synthesize_narration.py \
              --narration "build/narr_$t.json" \
              --out-dir "build/audio_$t"

            python scripts/generate_asset_video.py \
              --topic "$t" --narration "build/narr_$t.json" --audio-dir "build/audio_$t" --out "build/asset_$t"
            if [ $? -ne 0 ]; then
              echo "::warning::$t の動画生成に失敗しました"
              FAILED="$FAILED $t(動画)"
              echo "::endgroup::"; continue
            fi

            python scripts/generate_thumbnail.py \
              --kind asset --asset-topic "$t" \
              --out "build/asset_$t/thumb.png"

            # ショート用に、動画の1枚目(1080x1920)を切り出す。
            # 16:9はショート棚で中央405pxに切り抜かれ、文字が外へ出る。
            bash scripts/shorts_thumbnail.sh "build/asset_$t/collespo_asset_$t.mp4" "build/asset_$t/short.png"

            # 公開を選んだ回だけ予約する。限定公開・非公開の指定を保つ。
            asset_publication_args "${PRIVACY:-public}" "18:30"
            python scripts/upload_youtube.py \
              --video "build/asset_$t/collespo_asset_$t.mp4" \
              --kind asset --asset-topic "$t" \
              --thumbnail "build/asset_$t/short.png" \
              --privacy "${PRIVACY:-public}" $FORCE \
              "${ASSET_PUBLISH_ARGS[@]}"
            if [ $? -eq 0 ]; then
              echo "$t: 完了"
            else
              echo "::warning::$t の投稿に失敗しました（理由は上の記録の Traceback を見る）"
              FAILED="$FAILED $t(投稿)"
            fi
            echo "::endgroup::"
          done
          set -e

          if [ -n "$FAILED" ]; then
            echo "::warning title=未投稿のトピック::$FAILED"
            echo "割り当ては日本時間の17時ごろに回復します。翌日に残りを実行してください"
          fi

          # 動画自体は必ず1か所へ集めて、成果物として持ち帰れるようにする
          mkdir -p build/asset
          cp build/asset_*/*.mp4 build/asset/ 2>/dev/null || true

      - name: Commit published record
        if: always()
        run: |
          bash scripts/commit_data.sh \
            "published assets: ${{ github.run_id }}" \
            data/published_assets.json data/published_videos.json data/venue_topics.json data/team_topics.json data/venue_stats.json data/soccer_preview.json \
            data/rarity.json data/rare_topics.json data/legend_topics.json data/ws_topics.json data/token_usage.json

      # アップロードが失敗しても手元で確認できるよう、必ず成果物を残す
      - name: Save videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collespo-asset-${{ inputs.topic }}
          path: |
            build/asset/*.mp4
            !build/**/portrait/**
          retention-days: 14
          if-no-files-found: warn

      - name: Keep unsaved data records
        if: always() && hashFiles('build/data-save-recovery/**/FAILED') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-data-${{ github.job }}-${{ github.run_attempt }}
          path: |
            build/data-save-recovery/
            !build/**/portrait/**
          retention-days: 14
          if-no-files-found: error

      - name: Save sanity gate records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-gate-${{ github.job }}
          path: |
            data/sanity*.json
            build/sanity*hold*.json
            !build/**/portrait/**
          retention-days: 14
