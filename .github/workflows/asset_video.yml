name: Asset video

# 日付に依存しない「資産動画」を作ってYouTubeへ投稿する。
#
# 日次・週次と分けている理由:
#   内容が日付に依存しないので、決まった時刻に出す必要が無い。
#   作りたいときに手で回す方が、毎日のパイプラインを重くせずに済む。
#
# 既定では限定公開(unlisted)で上げる。
# 資産動画は一度公開すると長く残るため、内容を確認してから
# YouTube側で公開へ切り替える運用にしている。
# 確認済みのトピックを作り直すときだけ public を選ぶ。

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 作る資産動画のトピック
        type: choice
        options:
          - all
          - mlb_abbr
          - mlb_venue
          - mlb_rivalry
          - mlb_stats
          - mlb_terms
          - mlb_league
          - mlb_position
          - collespo_guide
          - jp_players
          - mlb_watch
          - mlb_postseason
          - venue_coors
          - venue_fenway
          - venue_wrigley
          - venue_oracle
          - venue_yankee
        default: mlb_abbr
      privacy:
        description: 公開設定
        type: choice
        options:
          - public
          - unlisted
          - private
        default: public
      force:
        description: 投稿済みのトピックも上げ直す(通常はオフ)
        type: boolean
        default: false

# 投稿済みの記録(data/published_assets.json)をコミットして残すため、
# 書き込み権限が要る。これが無いと毎回まっさらな状態から判断することになり、
# 同じ資産動画を何度も投稿してしまう。
permissions:
  contents: write

jobs:
  asset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      # aptが応答しなくなる事象が実行#2と#5で起きたため、
      # リトライとミラー切り替えを持つスクリプトへ切り出した。
      - name: Install video tools
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh

      # 球場の回で使う実測値。その年の全試合から集計するので、
      # 作るたびに最新の数字になる。取得できなくても、
      # 実測の項目が入らないだけで動画自体は作れる。
      - name: Fetch venue stats
        continue-on-error: true
        run: python scripts/venue_stats.py --out data/venue_stats.json

      - name: Start VOICEVOX engine
        continue-on-error: true
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox \
            voicevox/voicevox_engine:cpu-latest || \
            echo "::warning::VOICEVOXの起動に失敗しました。音声なしで進めます"
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      # 原稿は球団テーブルから機械的に組み立てるだけなので、
      # AIも外部APIも使わない(コストゼロ・内容は毎回同じ)。
      #
      # topic に all を選ぶと、全トピックを順に作って投稿する。
      # ただしYouTube Data APIの1日あたりの割り当ては10,000ユニットで、
      # 動画1本のアップロードが1,600、サムネイル設定が50かかる。
      # つまり1日あたり約6本が上限で、7本目は必ず割り当て超過で失敗する。
      # 途中で失敗しても残りを試し、最後に結果をまとめて出す。
      - name: Build and upload topics
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          TOPICS="${{ inputs.topic }}"
          if [ "$TOPICS" = "all" ]; then
            TOPICS="mlb_abbr mlb_venue mlb_rivalry mlb_stats mlb_terms mlb_league mlb_position collespo_guide jp_players mlb_watch mlb_postseason venue_coors venue_fenway venue_wrigley venue_oracle venue_yankee"
            echo "::notice::全トピックを対象にします。投稿済みのものは自動で飛ばします"
          fi

          FORCE=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE="--force"
            echo "::warning::投稿済みのトピックも上げ直します"
          fi

          # 1本が失敗しても残りを試す。ここを素通しにしていたため、
          # jp_players の不具合1件で以降のトピックが丸ごと未処理になった。
          set +e
          FAILED=""
          for t in $TOPICS; do
            echo "::group::$t"

            python scripts/generate_asset_video.py \
              --topic "$t" --narration-out "build/narr_$t.json"
            if [ $? -ne 0 ]; then
              echo "::warning::$t の原稿生成に失敗しました"
              FAILED="$FAILED $t(原稿)"
              echo "::endgroup::"; continue
            fi

            # VOICEVOXが落ちていても無音で作れるよう、ここは失敗を許容する
            python scripts/synthesize_narration.py \
              --narration "build/narr_$t.json" \
              --out-dir "build/audio_$t"

            python scripts/generate_asset_video.py \
              --topic "$t" --audio-dir "build/audio_$t" --out "build/asset_$t"
            if [ $? -ne 0 ]; then
              echo "::warning::$t の動画生成に失敗しました"
              FAILED="$FAILED $t(動画)"
              echo "::endgroup::"; continue
            fi

            python scripts/generate_thumbnail.py \
              --kind asset --asset-topic "$t" \
              --out "build/asset_$t/thumb.png"

            python scripts/upload_youtube.py \
              --video "build/asset_$t/collespo_asset_$t.mp4" \
              --kind asset --asset-topic "$t" \
              --thumbnail "build/asset_$t/thumb.png" \
              --privacy "${{ inputs.privacy }}" $FORCE
            if [ $? -eq 0 ]; then
              echo "$t: 完了"
            else
              echo "::warning::$t の投稿に失敗しました(APIの割り当て超過の可能性)"
              FAILED="$FAILED $t(投稿)"
            fi
            echo "::endgroup::"
          done
          set -e

          if [ -n "$FAILED" ]; then
            echo "::warning title=未投稿のトピック::$FAILED"
            echo "割り当ては日本時間の17時ごろに回復します。翌日に残りを実行してください"
          fi

          # 動画自体は必ず1か所へ集めて、成果物として持ち帰れるようにする
          mkdir -p build/asset
          cp build/asset_*/*.mp4 build/asset/ 2>/dev/null || true

      - name: Commit published record
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/published_assets.json data/venue_stats.json || true
          git diff --cached --quiet || git commit -m "published assets: ${{ github.run_id }}"
          git pull --rebase --quiet || true
          git push || echo "変更が無いか、push対象が無いためスキップ"

      # アップロードが失敗しても手元で確認できるよう、必ず成果物を残す
      - name: Save videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collespo-asset-${{ inputs.topic }}
          path: build/asset/*.mp4
          retention-days: 14
          if-no-files-found: warn
