name: 欧州サッカー　順位争い

# 欧州サッカーの順位争いショート。
#
# なぜこの枠を作るか:
#   実測（8/16〜9/13、199本）で順位表の回は繰り返し見られている。
#
#     MLBの進出争い   11本 平均100再生 **視聴率206.9%**
#     成績ランキング   34本 平均433再生  視聴率104.5%
#     コメント欄       23本 平均111再生  視聴率 58.9%
#
#   数字を確かめに戻ってくる種類の画面で、サッカーにはその枠が無い。
#   そして**順位争いは期間がいちばん長い。**MLBの進出争いは9〜10月の
#   2か月だが、サッカーは9月から5月まで材料があり続ける。
#
# いつ出すか:
#   **リーグごとに、その節が全クラブ終わったタイミング。**
#
#   最初は「昨日から線をまたいだクラブがいた日」にしていたが、
#   5大リーグとCLで6つあるので**ほぼ毎日どこかが動く。**しかも
#   同じリーグの話を何度もすることになる。
#
#   節の終わりなら区切りに意味があり、題も
#   「プレミアリーグ 第5節終了｜順位争い」と決まる。
#   **1本1大会。**まとめるとどのリーグの話か分からなくなる。
#
#   何節から出すかは大会の長さで変える（soccer_race.min_round）。
#   38節のリーグは5節から、CL（全8節）は3節から。
#   CLに5節を待たせると12月になり、1節から出すと順位表が
#   勝点0・1・3の3種類にしかならない（実物で確認した）。
#
#   形はショート（縦・36秒）。MLBの進出争いと同じで、順位表は
#   短いほうが繰り返し見られる。
#
# 投稿について:
#   公開は21:00（その時刻だけが他の枠と重ならない）。
#   手で回すときだけ upload=false で止められる。

on:
  # 19時のサッカー枠が終わったのを合図にする。cronは増やさない。
  # 順位表はその日の日次（19時）が取り直しているので、その後に走る。
  workflow_run:
    workflows: ["毎日 19:00　欧州サッカー"]
    types: [completed]
  workflow_dispatch:
    inputs:
      only:
        description: '大会を指定して作る (PL / PD / SA / BL1 / FL1 / CL)'
        required: false
        default: ''
      privacy:
        description: '公開設定 (private / unlisted / public)'
        required: false
        default: 'public'
      upload:
        description: 'YouTubeへ上げるか'
        required: false
        default: 'true'
      publish_at:
        description: '公開時刻 (HH:MM、空なら 21:00)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: soccer-race
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      # 今季の順位表。日次（19時）も取っているが、この枠を手で回す日は
      # そちらが走っていないことがある。古ければ取り直す。
      - name: Refresh standings
        continue-on-error: true
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python scripts/soccer_preview.py \
            --out data/soccer_preview.json --max-age-days 1

      # 節が終わった大会があるか。**無ければここで打ち切る。**
      #
      # --due が、節が終わっていて・最低節数を満たしていて・まだ
      # 出していない大会を1行ずつ返す。日本人選手がいる大会が先。
      - name: Which competition is due
        id: gate
        run: |
          DUE=$(python scripts/soccer_race.py \
                  --preview data/soccer_preview.json --due | head -1)
          CODE=$(printf '%s' "$DUE" | cut -f1)
          ROUND=$(printf '%s' "$DUE" | cut -f2)
          NAME=$(printf '%s' "$DUE" | cut -f3)
          if [ -n "${{ inputs.only }}" ]; then
            CODE="${{ inputs.only }}"
            ROUND=""
            echo "手で指定された大会を作ります: $CODE"
          fi
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "round=$ROUND" >> "$GITHUB_OUTPUT"
          if [ -z "$CODE" ]; then
            # 節の途中・最低節数に満たない・もう出した、のどれか。
            echo "::notice::節が終わった大会がありません"
            echo "count=0" >> "$GITHUB_OUTPUT"
          elif [ -z "$ROUND" ]; then
            echo "$CODE を作ります（節の指定なし）"
            echo "count=1" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME 第${ROUND}節が終わりました"
            echo "count=1" >> "$GITHUB_OUTPUT"
          fi

      # その大会だけで材料を作る。**1本1大会。**
      # 前日ぶんの順位表もここで退避される。
      - name: Build the race material
        if: steps.gate.outputs.count != '0'
        run: |
          python scripts/soccer_race.py \
            --preview data/soccer_preview.json \
            --only "${{ steps.gate.outputs.code }}" \
            --out data/soccer_race.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install video tools
        if: steps.gate.outputs.count != '0'
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh

      - name: Start VOICEVOX engine
        if: steps.gate.outputs.count != '0'
        continue-on-error: true
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox \
            voicevox/voicevox_engine:cpu-latest || \
            echo "::warning::VOICEVOXの起動に失敗しました"
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      - name: Write the script
        if: steps.gate.outputs.count != '0'
        run: |
          python scripts/generate_morning_short.py \
            --mode soccer_race --race data/soccer_race.json \
            --narration-out build/race_narration.json

      # 出す前に、常識で読み直す。
      #
      # 順位・勝点はAPIの値をそのまま並べているので桁が飛ぶことは
      # 無いはずだが、**無いはず**で出すものではない。
      # ここで落ちたら公開だけ止める。
      - name: Sanity check
        id: sanity
        if: steps.gate.outputs.count != '0'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/sanity.py --general --strict \
            --narration build/race_narration.json

      - name: Synthesize narration
        if: steps.gate.outputs.count != '0'
        run: |
          python scripts/synthesize_narration.py \
            --narration build/race_narration.json \
            --out-dir build/race_audio

      - name: Build the video
        if: steps.gate.outputs.count != '0'
        run: |
          python scripts/generate_morning_short.py \
            --mode soccer_race --race data/soccer_race.json \
            --audio-dir build/race_audio --out build/race --require-audio

      # ショート用に、動画の1枚目(1080x1920)を切り出す。
      # 16:9はショート棚で中央405pxに切り抜かれ、文字が外へ出る。
      #
      # ファイル名は generate_morning_short が決める形
      # （collespo_morning_<mode>.mp4）。9/13の初回は
      # collespo_short.mp4 を探していて、**動画はできたのに
      # サムネイルが作れなかった。**
      - name: Vertical thumbnail
        if: steps.gate.outputs.count != '0'
        continue-on-error: true
        run: |
          bash scripts/shorts_thumbnail.sh \
            build/race/collespo_morning_soccer_race.mp4 build/race/short.png

      # 自動で起動した回も投稿する。
      #
      # 最初は upload の既定を false にして様子を見ていたが、
      # **workflow_run で起動したときは inputs が空**なので、
      # 「既定を true にする」だけでは自動実行はいつまでも投稿しない。
      # 手で回したときだけ false にできる形にする。
      - name: Upload to YouTube
        if: >-
          steps.gate.outputs.count != '0' &&
          steps.sanity.outcome == 'success' &&
          (github.event_name != 'workflow_dispatch' ||
           inputs.upload == 'true')
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
        run: |
          # 21:00に置く理由は、その時刻だけが空いているから。
          # 17:00成績 / 18:00報道・コメント欄 / 18:30長編 /
          # 19:00注目試合・サッカー / 20:00進出争い / 22:00資産動画。
          AT="${{ inputs.publish_at }}"
          [ -n "$AT" ] || AT="21:00"
          python scripts/upload_youtube.py \
            --video build/race/collespo_morning_soccer_race.mp4 \
            --kind soccer_race --sport soccer \
            --narration build/race_narration.json \
            --thumbnail build/race/short.png \
            --privacy "${{ inputs.privacy || 'public' }}" --publish-at "$AT"

      # 出した節を記録する。**同じ節を2回出さないため。**
      # 投稿した回だけ記録する（作っただけの回で消費しない）。
      - name: Remember the round
        if: >-
          steps.gate.outputs.count != '0' &&
          steps.gate.outputs.round != '' &&
          (github.event_name != 'workflow_dispatch' ||
           inputs.upload == 'true')
        run: |
          python - <<'PY'
          import json, pathlib, os
          p = pathlib.Path("data/soccer_race_state.json")
          try:
              state = json.loads(p.read_text(encoding="utf-8"))
          except Exception:
              state = {}
          code = os.environ["RACE_CODE"]
          state[code] = int(os.environ["RACE_ROUND"])
          p.write_text(json.dumps(state, ensure_ascii=False, indent=2),
                       encoding="utf-8")
          print("記録しました:", state)
          PY
        env:
          RACE_CODE: ${{ steps.gate.outputs.code }}
          RACE_ROUND: ${{ steps.gate.outputs.round }}

      - name: Keep the video
        if: always() && steps.gate.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: soccer-race
          path: |
            build/race/collespo_morning_soccer_race.mp4
            build/race_narration.json
          if-no-files-found: warn

      # 前日ぶんの順位表と、作った材料を残す。
      # **翌日の「昨日またいだか」がこれに依る。**
      #
      # morning_recap / player_profile も並べているのは、
      # generate_morning_short.py の引数の既定値がそれらを指していて、
      # 検査（run_checks の「作ったのにコミットしていないもの」）が
      # 書き込む可能性ありと見るため。この枠では書き換えないので
      # 差分は出ないが、**渡し忘れと区別が付かない**ので並べておく。
      - name: Commit the material
        if: always()
        continue-on-error: true
        run: |
          bash scripts/commit_data.sh \
            "soccer race: ${{ github.run_id }}" \
            data/soccer_race.json data/soccer_preview.json \
            data/soccer_preview_prev.json data/soccer_race_state.json \
            data/published_videos.json \
            data/morning_recap.json data/player_profile.json

      - name: Say what happened
        if: always()
        run: |
          {
            echo "## 順位争い"
            echo
            if [ -n "${{ steps.gate.outputs.round }}" ]; then
              echo "- 対象: ${{ steps.gate.outputs.code }} 第${{ steps.gate.outputs.round }}節"
            else
              echo "- 対象: ${{ steps.gate.outputs.code }}（手で指定）"
            fi
            if [ -f build/race/collespo_morning_soccer_race.mp4 ]; then
              echo "- 動画: $(du -h build/race/collespo_morning_soccer_race.mp4 | cut -f1)"
            else
              echo "- **動画は作れませんでした**"
            fi
            echo "- 公開設定: ${{ inputs.privacy }} / 投稿: ${{ inputs.upload }}"
            echo
            echo '### 読み上げ'
            echo
            echo '```'
            python - <<'PY'
          import json, pathlib
          try:
              d = json.loads(pathlib.Path("build/race_narration.json")
                             .read_text(encoding="utf-8"))
              for s in d.get("segments", []):
                  print("[%s] %s" % (s.get("kind", "?"), s.get("text", "")))
          except Exception as e:
              print("(原稿を読めません: %s)" % e)
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
