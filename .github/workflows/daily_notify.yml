name: Daily notable games

# 実行タイミングについて:
# GitHub Actions純正のscheduleトリガーは「best-effort」であり、特にこの
# リポジトリのように作成から日が浅いものは、GitHub側の負荷分散の都合で
# 数時間単位で遅延することが判明した(2026年7月確認)。19時ちょうどに届く
# ことが体験の核なので、外部のcronサービス(cron-job.org)からGitHub API
# (workflows/daily_notify.yml/dispatches)を叩く方式に切り替えた。
# そのため、ここではscheduleトリガーを持たず、workflow_dispatchのみを
# 起点とする(cron-job.org側のジョブ、または手動実行のいずれかで動く)。
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      - name: Generate today's notable games
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python notability_engine.py --source all --out notable_games.json

      # 過去に生成した試合(直近5日分)のうち、終了しているのにまだ
      # 最終スコアが無いものを、MLB Stats APIから取得して埋める。
      # 生成時点(19時JST)ではまだ試合が始まってすらいないため、
      # 結果は必ず「後から追いかけて埋める」形にならざるを得ない。
      - name: Backfill past game results
        run: python scripts/backfill_results.py --archive-dir archive

      - name: Generate RSS feed
        run: |
          python scripts/generate_rss.py --input notable_games.json --out feed.xml \
            --site-url "https://collespo.com/"

      # 選手の所属変化を検知してニュース化する。
      # 差分は「候補」に過ぎないため、スクリプト内でAPIに問い合わせて
      # 裏が取れたものだけを出力する(検証に落ちたものは公開しない)。
      # スナップショットは次回比較用にリポジトリへコミットする。
      - name: Detect roster changes
        run: |
          mkdir -p public
          python scripts/detect_roster_changes.py \
            --snapshot data/roster_snapshot.json \
            --out public/news.json

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ data/ || true
          git diff --cached --quiet || git commit -m "archive: ${{ github.run_id }}"
          git push || echo "変更が無いか、push対象が無いためスキップ"

      - name: Assemble Pages site
        run: |
          mkdir -p public
          cp -r web/* public/
          cp notable_games.json public/games.json
          cp feed.xml public/feed.xml

      # ベストナイン編成用の選手成績。MLB Stats APIのseason成績は試合ごとに
      # 更新されるため、毎日ここで取り直せば常に最新の状態が保たれる。
      - name: Generate player stats
        run: python scripts/generate_player_stats.py --out public/player_stats.json

      # 選手ページはsitemap生成より前に作る必要がある
      # (generate_archive_pages.pyがpublic/players配下を走査してsitemapに載せるため)
      - name: Generate player pages
        run: |
          python scripts/generate_player_pages.py \
            --archive-dir archive \
            --out-dir public/players

      # アーカイブを「日付ごとの静的HTML」として生成する。
      # public/ に出力することで、蓄積したデータが公開サイトから
      # 日付ごとの独立したURLで読める状態になる。
      - name: Generate archive pages
        run: |
          python scripts/generate_archive_pages.py \
            --archive-dir archive \
            --out-dir public/archive \
            --site-root public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 旧方式(VAPID + scripts/send_push.py)のステップはここにあったが、
      # OneSignalへの移行が完了し、購読者はすべてOneSignal側で管理して
      # いるため削除した。scripts/send_push.py への依存も無くなっている。
      # (Secretsの PUSH_SUBSCRIPTION / VAPID_PRIVATE_KEY / VAPID_SUBJECT も
      #  もう参照されないので、GitHub側から削除して構わない)

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_URL: https://collespo.com/
        run: python scripts/post_bluesky.py

      - name: Send push via OneSignal
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          SITE_URL: https://collespo.com/
        run: python scripts/send_onesignal.py

      # ---- 動画の生成と投稿 ----
      # サイト更新・通知が全て終わってから実行する。
      # ここで失敗しても、その日の配信自体は既に完了している状態にするため。
      - name: Install video tools
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk ffmpeg
          fc-list :lang=ja | head -3
          ffmpeg -version | head -1

      - name: Start VOICEVOX engine
        continue-on-error: true
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox \
            voicevox/voicevox_engine:cpu-latest || \
            echo "::warning::VOICEVOXの起動に失敗しました。音声なしで進めます"
          # 起動を待つ(最大60秒)
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      # 動画の描画・書き出しに必要なもの。ランナーには
      # 日本語フォントもffmpegも入っていないため、ここで入れる。
      - name: Generate narration script
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_narration.py \
            --games notable_games.json \
            --news public/news.json \
            --out public/narration.json

      - name: Synthesize narration
        continue-on-error: true
        run: |
          python scripts/synthesize_narration.py \
            --narration public/narration.json \
            --out-dir build/audio

      - name: Generate video
        continue-on-error: true
        run: |
          python scripts/generate_video.py \
            --games notable_games.json \
            --audio-dir build/audio \
            --out build/video

      - name: Upload to YouTube
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py \
            --video build/video/collespo_short.mp4 \
            --games notable_games.json \
            --privacy public

      - name: Save video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: collespo-video
          path: build/video/collespo_short.mp4
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: build_and_notify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
