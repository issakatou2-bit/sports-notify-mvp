name: Daily notable games

# 実行タイミングについて:
# GitHub Actions純正のscheduleトリガーは「best-effort」であり、特にこの
# リポジトリのように作成から日が浅いものは、GitHub側の負荷分散の都合で
# 数時間単位で遅延することが判明した(2026年7月確認)。19時ちょうどに届く
# ことが体験の核なので、外部のcronサービス(cron-job.org)からGitHub API
# (workflows/daily_notify.yml/dispatches)を叩く方式に切り替えた。
# そのため、ここではscheduleトリガーを持たず、workflow_dispatchのみを
# 起点とする(cron-job.org側のジョブ、または手動実行のいずれかで動く)。
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate today's notable games
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python notability_engine.py --source all --out notable_games.json

      - name: Generate RSS feed
        run: |
          python scripts/generate_rss.py --input notable_games.json --out feed.xml \
            --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add archive/ || true
          git diff --cached --quiet || git commit -m "archive: ${{ github.run_id }}"
          git push || echo "変更が無いか、push対象が無いためスキップ"

      - name: Assemble Pages site
        run: |
          mkdir -p public
          cp -r web/* public/
          cp notable_games.json public/games.json
          cp feed.xml public/feed.xml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 初回セットアップ時はPUSH_SUBSCRIPTIONがまだ無いため、このステップは
      # Secretsが設定されてから初めて実行される(それまでは自動でスキップ)
      - name: Check if push subscription is configured
        id: check_push
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
        run: |
          if [ -n "$PUSH_SUBSCRIPTION" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PUSH_SUBSCRIPTIONが未設定のため通知送信をスキップしました"
          fi

      - name: Send push notification
        if: steps.check_push.outputs.configured == 'true'
        env:
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/send_push.py

      - name: Post to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/post_bluesky.py

      - name: Send push via OneSignal
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python scripts/send_onesignal.py

  deploy:
    needs: build_and_notify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
