name: Daily notable games

# 実行タイミングについて:
# GitHub Actions純正のscheduleトリガーは「best-effort」であり、特にこの
# リポジトリのように作成から日が浅いものは、GitHub側の負荷分散の都合で
# 数時間単位で遅延することが判明した(2026年7月確認)。19時ちょうどに届く
# ことが体験の核なので、外部のcronサービス(cron-job.org)からGitHub API
# (workflows/daily_notify.yml/dispatches)を叩く方式に切り替えた。
# そのため、ここではscheduleトリガーを持たず、workflow_dispatchのみを
# 起点とする(cron-job.org側のジョブ、または手動実行のいずれかで動く)。
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# deploy_site.yml と同じグループにしておく。両方が同時にPagesへ出すと、
# 後から終わった方が相手の成果物で上書きしてしまう。
# cancel-in-progress: false なので、日次実行が途中で止められることはない。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      - name: Generate today's notable games
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # サッカーは soccer_daily.yml が別の1本として出す。
        # ここを all にすると、日次1本の3枠をMLBと取り合うことになる。
        # MLBは毎日15試合・日本人10人以上あるので、平日はサッカーが
        # 1枠も取れず、週末だけMLBが押し出される形になっていた。
        run: python notability_engine.py --source mlb --out notable_games.json

      # 選手の所属変化を検知してニュース化する。
      # 差分は「候補」に過ぎないため、スクリプト内でAPIに問い合わせて
      # 裏が取れたものだけを出力する(検証に落ちたものは公開しない)。
      # スナップショットは次回比較用にリポジトリへコミットする。
      # サッカーの試合はここで取る。プッシュもSNSもRSSもサイトも、
      # そして20時の動画も、このファイルを読む。配信より前に取っておかないと
      # 前日ぶんを配ることになる。別々に取ると、取得の間に日程が動いたときに
      # 載っている試合が食い違う。
      - name: Fetch soccer fixtures
        continue-on-error: true
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python notability_engine.py --source soccer \
            --out data/soccer_games.json

      # ニュースが取れなくても、動画もサイトも作れる。
      - name: Detect roster changes
        continue-on-error: true
        run: |
          mkdir -p public
          python scripts/detect_roster_changes.py \
            --snapshot data/roster_snapshot.json \
            --out public/news.json

      # データの準備が終わったら、19時ちょうどになるまで待ってから配信する。
      # 早めに起動しておけば、処理時間が日によって変動しても
      # 「毎日19時00分に届く」ことを保証できる。
      # 既に19時を過ぎている場合(手動実行や遅延時)は待たずに即送信する。
      - name: Wait until 19:00 JST
        run: |
          TARGET_MIN=$((19 * 60))
          NOW_MIN=$(( $(TZ=Asia/Tokyo date +%H) * 60 + $(TZ=Asia/Tokyo date +%-M) ))
          WAIT=$(( (TARGET_MIN - NOW_MIN) * 60 - $(TZ=Asia/Tokyo date +%-S) ))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -le 900 ]; then
            echo "19:00まで ${WAIT} 秒待機します"
            sleep "$WAIT"
          else
            echo "待機不要(現在 $(TZ=Asia/Tokyo date +%H:%M:%S) JST)"
          fi
          echo "配信開始: $(TZ=Asia/Tokyo date +%H:%M:%S) JST"

      # 配信先の失敗で、その日の動画とサイトまで落とさない。
      # 実際、通知が AttributeError で落ちた日に、以降のステップが
      # 1つも動かず、動画もRSSもサイト更新も丸ごと消えた。
      # 通知は届かなければ困るが、本体はあくまで動画とサイト。
      - name: Post to Bluesky
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          SITE_URL: https://collespo.com/
        run: python scripts/post_bluesky.py

      # Threadsは投稿ごとの確認画面を要求しないので、完全に自動で出せる。
      # 未設定なら黙って飛ぶ。落として毎日ノイズを出す価値は無い。
      - name: Post to Threads
        continue-on-error: true
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SITE_URL: https://collespo.com/
        run: python scripts/post_threads.py

      - name: Send push via OneSignal
        continue-on-error: true
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          SITE_URL: https://collespo.com/
        run: |
          python scripts/send_onesignal.py \
            --games notable_games.json \
            --games data/soccer_games.json

      # 過去に生成した試合(直近5日分)のうち、終了しているのにまだ
      # 最終スコアが無いものを、MLB Stats APIから取得して埋める。
      # 生成時点(19時JST)ではまだ試合が始まってすらいないため、
      # 結果は必ず「後から追いかけて埋める」形にならざるを得ない。
      # 過去のアーカイブに結果を埋める処理。MLB側のAPIを叩くので、
      # 先方が不調な日にその日の配信ごと落とすのは割に合わない。
      # サッカーの結果は football-data.org から取るので、鍵が要る。
      # 鍵が無いとサッカーの分だけ静かに飛ばされ、答え合わせに出てこない。
      - name: Backfill past game results
        continue-on-error: true
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/backfill_results.py --archive-dir archive

      # コレスポが取り上げた試合の実測。結果を埋めた直後に数え直す。
      # 予測はしない。「これまでこうだった」を件数つきで置くだけ。
      - name: Count what actually happened
        continue-on-error: true
        run: |
          python scripts/base_rates.py \
            --archive-dir archive --out data/base_rates.json

      # 購読者には1つのフィードで届ける。競技ごとに1件ずつ出る。
      - name: Generate RSS feed
        # サイトが1日古くなるより、動画が出ない方が痛い。
        # 動画の生成はこれらより後ろに並んでいる。
        continue-on-error: true
        run: |
          python scripts/generate_rss.py \
            --input notable_games.json \
            --input data/soccer_games.json \
            --out feed.xml --site-url "https://collespo.com/"

      - name: Commit archive
        run: |
          bash scripts/commit_data.sh \
            "archive: ${{ github.run_id }}" \
            archive/ podcast/

      - name: Assemble Pages site
        # サイトが1日古くなるより、動画が出ない方が痛い。
        # 動画の生成はこれらより後ろに並んでいる。
        continue-on-error: true
        run: |
          mkdir -p public
          cp -r web/* public/
          # サイトはこの1ファイルしか読まない。MLBだけを入れていたため、
          # トップページの「欧州サッカー」タブが毎日空だった。
          # プッシュもRSSも動画も両方を受け取っているのに、サイトだけが
          # 片方しか渡されていなかった。1つにまとめて渡す。
          python scripts/merge_games.py \
            --input notable_games.json \
            --input data/soccer_games.json \
            --out public/games.json
          cp feed.xml public/feed.xml

      # ベストナイン編成用の選手成績。MLB Stats APIのseason成績は試合ごとに
      # 更新されるため、毎日ここで取り直せば常に最新の状態が保たれる。
      - name: Generate player stats
        # サイトが1日古くなるより、動画が出ない方が痛い。
        # 動画の生成はこれらより後ろに並んでいる。
        continue-on-error: true
        run: python scripts/generate_player_stats.py --out public/player_stats.json

      # 開幕日程と昨季順位。中身は日単位ではほぼ動かないので、
      # 3日以内に取ったものがあればそのまま使う(無料枠の節約)。
      - name: Refresh soccer preview
        continue-on-error: true
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          python scripts/soccer_preview.py \
            --out data/soccer_preview.json --max-age-days 3

      # 勝利貢献スコアの計算方法。コード側の定数から作るので、
      # 重みを変えれば公開している式も一緒に変わる。
      - name: Generate score page
        continue-on-error: true
        run: python scripts/generate_score_page.py --out public/score.html

      # 欧州サッカーの案内ページ。名簿と data/soccer_preview.json から作る。
      # preview が無くても、名簿と解説だけでページは成立する。
      - name: Generate soccer page
        continue-on-error: true
        run: |
          python scripts/generate_soccer_page.py \
            --preview data/soccer_preview.json \
            --games data/soccer_games.json \
            --out public/soccer.html

      # 選手ページはsitemap生成より前に作る必要がある
      # (generate_archive_pages.pyがpublic/players配下を走査してsitemapに載せるため)
      - name: Generate player pages
        # サイトが1日古くなるより、動画が出ない方が痛い。
        # 動画の生成はこれらより後ろに並んでいる。
        continue-on-error: true
        run: |
          python scripts/generate_player_pages.py \
            --archive-dir archive \
            --out-dir public/players

      # アーカイブを「日付ごとの静的HTML」として生成する。
      # public/ に出力することで、蓄積したデータが公開サイトから
      # 日付ごとの独立したURLで読める状態になる。
      - name: Generate archive pages
        # サイトが1日古くなるより、動画が出ない方が痛い。
        # 動画の生成はこれらより後ろに並んでいる。
        continue-on-error: true
        run: |
          python scripts/generate_archive_pages.py \
            --archive-dir archive \
            --out-dir public/archive \
            --site-root public

      # サイトからYouTubeへの導線。動画の説明文にはサイトのURLを載せて
      # いたが、逆向きが一つも無く、サイトに来た人は同じ内容を動画でも
      # 見られることを知らないまま帰っていた。
      # 用語集は特に相性が良い(「OPSとは」を調べに来た人へ、同じ説明の動画)。
      - name: Inject video links into the site
        continue-on-error: true
        run: python scripts/inject_video_links.py --site public

      # ---- 動画の生成と投稿 ----
      # サイト更新・通知が全て終わってから実行する。
      # ここで失敗しても、その日の配信自体は既に完了している状態にするため。
      # 通知とサイト更新はこの時点で終わっているので、
      # ここで失敗しても配信自体は成立する(continue-on-error)。
      - name: Install video tools
        continue-on-error: true
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh

      - name: Start VOICEVOX engine
        continue-on-error: true
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox \
            voicevox/voicevox_engine:cpu-latest || \
            echo "::warning::VOICEVOXの起動に失敗しました。音声なしで進めます"
          # 起動を待つ(最大60秒)
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      # 動画の描画・書き出しに必要なもの。ランナーには
      # 日本語フォントもffmpegも入っていないため、ここで入れる。
      - name: Generate narration script
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_narration.py \
            --games notable_games.json \
            --news public/news.json \
            --out public/narration.json

      - name: Synthesize narration
        continue-on-error: true
        run: |
          python scripts/synthesize_narration.py \
            --narration public/narration.json \
            --out-dir build/audio

      # 動画用に作った音声を、そのままポッドキャストにも転用する。
      # 追加のAI呼び出しも音声合成も不要なので、実質コストはゼロ。
      - name: Generate podcast
        continue-on-error: true
        run: |
          python scripts/generate_podcast.py \
            --audio-dir build/audio \
            --store podcast \
            --public public/podcast \
            --games notable_games.json

      # ポッドキャストのmp3をpublic/へ出した後に、Pagesへ渡す。
      # 順序が逆だと、その日のエピソードが公開されない。
      - name: Upload Pages artifact
        # サイトが1日古くなるより、動画が出ない方が痛い。
        # 動画の生成はこれらより後ろに並んでいる。
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      # 旧方式(VAPID + scripts/send_push.py)のステップはここにあったが、
      # OneSignalへの移行が完了し、購読者はすべてOneSignal側で管理して
      # いるため削除した。scripts/send_push.py への依存も無くなっている。
      # (Secretsの PUSH_SUBSCRIPTION / VAPID_PRIVATE_KEY / VAPID_SUBJECT も
      #  もう参照されないので、GitHub側から削除して構わない)

      - name: Commit podcast episode
        continue-on-error: true
        run: |
          bash scripts/commit_data.sh \
            "podcast: ${{ github.run_id }}" \
            podcast/

      - name: Generate video
        continue-on-error: true
        run: |
          python scripts/generate_video.py \
            --games notable_games.json \
            --audio-dir build/audio \
            --out build/video --require-audio

      # サムネイルを指定しないと、YouTubeが動画中のコマを自動で選ぶ。
      # 検索結果や関連動画ではそれがクリック率を左右するため、
      # 動画の1枚目と同じフックで自前のものを作る。
      - name: Generate thumbnail
        continue-on-error: true
        run: |
          python scripts/generate_thumbnail.py \
            --kind daily \
            --games notable_games.json \
            --narration public/narration.json \
            --out build/video/thumb.png

      - name: Upload to YouTube
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py \
            --video build/video/collespo_short.mp4 \
            --games notable_games.json \
            --narration public/narration.json \
            --thumbnail build/video/thumb.png \
            --privacy public

      # 読み上げの本文をそのまま字幕にする。
      #
      # 字幕なしで見られている割合が70%。ショートは音を切って見る人が
      # 多いので、そこに何も出していないと読み上げの中身が丸ごと落ちる。
      # 自動生成に任せず本文を渡すのは、VOICEVOXの音声を聞き取り直させると
      # 選手名と球団名が確実に崩れるため。元の文字はこちらが持っている。
      - name: Add Japanese captions
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/captions.py             --narration public/narration.json             --audio-dir build/audio --kind daily

      # 同じ動画をTikTokへも出す。タイトルはYouTube側の記録から借りるので、
      # 先にUpload to YouTubeが終わっている必要がある。
      #
      # TIKTOK_REFRESH_TOKEN が未設定なら黙って飛ばす。審査が通るまでは
      # 設定しない運用になるため、失敗として出すと毎日ノイズになる。
      # 審査前は video.publish が付かないので、自動的に下書き投稿になる。
      - name: Post to TikTok
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          if [ -z "$TIKTOK_REFRESH_TOKEN" ]; then
            echo "TikTokは未設定のため飛ばします"
            exit 0
          fi
          python scripts/post_tiktok.py \
            --video build/video/collespo_short.mp4 \
            --kind daily

      # 種類ごとの再生リストへ入れる。ショートを見た人に
      # 「毎日ここに増えている」を見せるための導線。
      # youtube スコープが要るので、取り直すまでは何もせず終わる。
      - name: Add to playlists
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # --sync は記録(11本)しか見ない。記録は4日間止まっていた
        # ことがあるので、チャンネルの投稿一覧から入れる。
        # 既に入っているものは飛ばすので、毎日回して問題ない。
        run: python scripts/playlists.py --backfill

      # 英語のタイトルと説明文を足す。日本語版は変えない。
      # 自動吹き替えで音声は英語になるが、タイトルが日本語のままだと
      # 英語圏の人はそこへ辿り着けない。視聴の35.8%が日本以外。
      - name: Add English metadata
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/localize_videos.py --recent 6

      # 動画IDは翌日以降のアーカイブページから参照する。
      # コミットしないと記録が毎回消えてしまう。
      - name: Commit video record
        if: always()
        continue-on-error: true
        run: |
          bash scripts/commit_data.sh \
            "video record: ${{ github.run_id }}" \
            data/published_videos.json data/published_tiktok.json data/playlists.json data/localized.json

      - name: Save video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: collespo-video
          path: build/video/collespo_short.mp4
          retention-days: 7
          if-no-files-found: ignore

      # 最後に検品する。配信の各ステップは1つの失敗で全部を落とさないよう
      # continue-on-error にしてあるが、そのぶん動画が1本も出ていない回も
      # 実行は緑になる。8/16の再実行が実際にそうだった。
      # 途中では止めず、最後に落とす。順序はそのまま、結果だけ正直にする。
      - name: Confirm the video went out
        if: always()
        run: python scripts/verify_published.py --kind daily

  deploy:
    needs: build_and_notify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
