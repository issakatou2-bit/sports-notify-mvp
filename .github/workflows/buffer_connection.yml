name: Buffer 接続確認（投稿しません）

on:
  workflow_dispatch: {}
  push:
    branches: [codex/site-social-20260911]
    paths: [scripts/buffer_api.py, .github/workflows/buffer_connection.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check connected channels and recent posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python scripts/buffer_api.py
