name: Weekly summary video

# 週次のまとめ動画(横型・8分以上)を作ってYouTubeへ投稿する。
#
# 日次のワークフローと分けている理由:
#   ・週1回しか動かさないので、毎日のパイプラインに混ぜると
#     条件分岐が増えて見通しが悪くなる
#   ・生成に15分前後かかるため、19時の通知を遅らせたくない
#
# 実行タイミング:
#   日曜。日次(18:52起動)が終わったのを合図にする。
#
#   以前は GitHub の schedule で日曜21時(UTC 12:00)を指定していた。
#   ただしGitHubのscheduleは2〜4時間遅れる。日次はそれが理由で
#   cron-job.orgからの起動に切り替えてあり、こちらだけ放置していた。
#   週1本の動画が23時に出たり翌1時に出たりしていたことになる。
#
#   外部cronをもう1本増やす手もあるが、設定する場所も壊れる場所も増える。
#   日次は毎日確実に動いているので、それに乗る。曜日の判定は下の gate で行う。
#   二重投稿は upload_youtube.py が区分と日付で弾く。

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["Daily notable games"]
    types: [completed]

# 投稿の記録をコミットするので write が要る。
permissions:
  contents: write

jobs:
  # 日曜かどうかだけを見る。JSTで判定する(UTCだと日曜の朝までが土曜になる)。
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.day.outputs.go }}
    steps:
      - name: Check the day
        id: day
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行なので曜日を問わず進めます"
            echo "go=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOW=$(TZ=Asia/Tokyo date +%u)   # 1=月 ... 7=日
          if [ "$DOW" = "7" ]; then
            echo "日曜なので週次を作ります"
            echo "go=1" >> "$GITHUB_OUTPUT"
          else
            echo "日曜ではないので何もしません (曜日=$DOW)"
            echo "go=0" >> "$GITHUB_OUTPUT"
          fi

  weekly:
    needs: gate
    if: needs.gate.outputs.go == '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      - name: Install video tools
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh

      # 週次動画にもナレーションを入れる。
      # これが無いと音声manifestが作られず、無音の動画になる。
      - name: Start VOICEVOX engine
        continue-on-error: true
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox \
            voicevox/voicevox_engine:cpu-latest || \
            echo "::warning::VOICEVOXの起動に失敗しました。音声なしで進めます"
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      # 日本人打者の直近7日の成績。選手ごとにAPIを1回ずつ叩くので、
      # 日次のパイプラインには入れず、週次でのみ取得する。
      - name: Fetch weekly OPS
        continue-on-error: true
        run: python scripts/weekly_ops.py --out data/weekly_ops.json

      - name: Generate weekly narration
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python scripts/generate_weekly_narration.py \
            --archive-dir archive \
            --out build/weekly_narration.json

      - name: Synthesize weekly narration
        continue-on-error: true
        run: |
          python scripts/synthesize_narration.py \
            --narration build/weekly_narration.json \
            --out-dir build/weekly_audio

      - name: Generate weekly video
        run: |
          python scripts/generate_weekly.py \
            --archive-dir archive \
            --audio-dir build/weekly_audio \
            --out build/weekly

      # --label を省くと、動画側と同じ条件(weekly_stats.load_week)で
      # 週の範囲をアーカイブから求める
      - name: Generate thumbnail
        continue-on-error: true
        run: |
          python scripts/generate_thumbnail.py \
            --kind weekly \
            --out build/weekly/thumb.png

      # 公開時刻を決める。
      #
      # これまで指定が無く、出来上がった順に公開していた。日次の完走に
      # 乗せているので、日次を手で回した日は23:49に出る。10分の動画が
      # 深夜に無言で現れても、誰の目にも触れない。
      # 21:00は現地の報道の枠なので、そこは避けて22:00に置く。
      - name: Upload to YouTube
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py \
            --video build/weekly/collespo_weekly.mp4 \
            --games notable_games.json \
            --kind weekly \
            --thumbnail build/weekly/thumb.png \
            --privacy public --publish-at "22:00"

      # ---- 答え合わせショート ----
      # 週次まとめの一画面に埋もれさせるには惜しい内容なので、縦型ショートとしても出す。
      # 「◯連勝中だから注目」と書いた試合がどうなったかは、毎日予告を出して
      # 結果まで記録している側にしか言えない。
      - name: Generate verdict short narration
        continue-on-error: true
        run: |
          python scripts/base_rates.py \
            --archive-dir archive --out data/base_rates.json
          python scripts/generate_verdict_short.py \
            --archive-dir archive \
            --base-rates data/base_rates.json \
            --narration-out build/vs_narration.json

      - name: Synthesize verdict narration
        continue-on-error: true
        run: |
          python scripts/synthesize_narration.py \
            --narration build/vs_narration.json \
            --out-dir build/vs_audio

      - name: Generate verdict short
        continue-on-error: true
        run: |
          python scripts/generate_verdict_short.py \
            --archive-dir archive \
            --audio-dir build/vs_audio \
            --out build/verdict

      - name: Generate verdict thumbnail
        continue-on-error: true
        run: |
          python scripts/generate_thumbnail.py \
            --kind verdict --out build/verdict/thumb.png

      - name: Upload verdict short to YouTube
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py \
            --video build/verdict/collespo_verdict.mp4 \
            --kind verdict \
            --thumbnail build/verdict/thumb.png \
            --privacy public

      # 投稿の記録を残す。
      #
      # これまで残していなかった。upload_youtube.py は
      # data/published_videos.json を見て二重投稿を防ぐが、その記録が
      # 毎回捨てられていたので、週次では二重投稿の防止が一度も働いていない。
      # 起動を日次の完走に乗せた今、日曜に日次を2回動かせば週次も2回動く。
      # 残しておけば2本目は弾かれる。健康診断も週次を確認できるようになる。
      - name: Commit video record
        if: always()
        continue-on-error: true
        run: |
          bash scripts/commit_data.sh \
            "weekly record: ${{ github.run_id }}" \
            data/published_videos.json data/published_tiktok.json data/playlists.json data/localized.json data/base_rates.json

      # 作れなかった回を緑のまま通さない。週1本しか無いので、
      # 翌朝の健康診断まで気付かないのは遅い。
      - name: Confirm the videos went out
        if: always()
        run: |
          python scripts/verify_published.py --kind weekly
          python scripts/verify_published.py --kind verdict

      - name: Save videos as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collespo-weekly
          path: |
            build/weekly/collespo_weekly.mp4
            build/verdict/collespo_verdict.mp4
          retention-days: 7
          if-no-files-found: ignore
