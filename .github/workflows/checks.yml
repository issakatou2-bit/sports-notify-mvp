name: 検査　pushのたびに

# 押されたコードを、動かさなくても分かる範囲で検査する。
#
# テストは書いてあったのに、CIで一度も走っていなかった。手元で気づいた
# ときだけ実行する運用だったので、そのまま壊れたものが本番へ出た。
#
#   ・実行ページへ出す処理で変数を定義せずに参照していた
#     (手元にGoogleのライブラリが無くて動かせず、そのまま押した)
#   ・サッカーの採点が本番で1つも発火しなかった
#     (テストは通っていたが、渡していた値が実物と違った)
#
# APIキーは使わない。鍵の要るものはここでは見ない。

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'web/**'
      - 'notability_engine.py'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check_suite:
    runs-on: ubuntu-latest
    strategy:
      # 失敗した分割があっても、残りの全試験を最後まで実行する。
      fail-fast: false
      matrix:
        include:
          - section: static
            shard: 0
          - section: tests
            shard: 0
          - section: tests
            shard: 1
          - section: tests
            shard: 2
          - section: tests
            shard: 3
    steps:
      - uses: actions/checkout@v4
        with:
          # 見本づくりの試験は「変更前のコード」を git show で取り出して画素を比べる。
          # 最新の1コミットだけだと取り出せずに落ちる（10/13 #151〜#153）。履歴を全部取る。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            .github/workflows/checks.yml

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pyflakes pyyaml pillow pytest imageio_ffmpeg 'cryptography>=46,<50'

      - name: Cache Japanese fonts
        uses: actions/cache@v4
        with:
          path: ~/.cache/collespo-noto-cjk
          key: ${{ runner.os }}-${{ runner.arch }}-noto-cjk-v1

      - name: Install Japanese fonts for checks
        # 環境変数を消す試験と固定パスを使う描画処理にも字体を届ける。
        # キャッシュがなければ apt を再試行し、実際に描けなければ失敗する。
        run: |
          python scripts/check_diagram_font.py
          python scripts/install_ci_fonts.py
          fc-cache -f /usr/share/fonts/opentype/noto

      - name: Run checks
        run: python scripts/run_checks.py --section ${{ matrix.section }} --test-shard ${{ matrix.shard }}/4 --import-workers 4 --timings-json build/checks-timings-${{ matrix.section }}-${{ matrix.shard }}.json

      - name: Save check timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-timings-${{ matrix.section }}-${{ matrix.shard }}
          path: build/checks-timings-${{ matrix.section }}-${{ matrix.shard }}.json
          if-no-files-found: warn

      - name: Check interactive pages and appearance preferences
        if: ${{ !cancelled() && matrix.section == 'static' }}
        run: node --test scripts/test_web_*.cjs

  # 従来の必須チェック名を維持し、全分割の成功だけを通過とする。
  checks:
    if: always()
    needs: check_suite
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard
        env:
          RESULT: ${{ needs.check_suite.result }}
        run: test "$RESULT" = success
