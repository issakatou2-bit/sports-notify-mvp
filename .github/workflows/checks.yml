name: 検査　pushのたびに

# 押されたコードを、動かさなくても分かる範囲で検査する。
#
# テストは書いてあったのに、CIで一度も走っていなかった。手元で気づいた
# ときだけ実行する運用だったので、そのまま壊れたものが本番へ出た。
#
#   ・実行ページへ出す処理で変数を定義せずに参照していた
#     (手元にGoogleのライブラリが無くて動かせず、そのまま押した)
#   ・サッカーの採点が本番で1つも発火しなかった
#     (テストは通っていたが、渡していた値が実物と違った)
#
# APIキーは使わない。鍵の要るものはここでは見ない。

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'web/**'
      - 'notability_engine.py'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 見本づくりの試験は「変更前のコード」を git show で取り出して画素を比べる。
          # 最新の1コミットだけだと取り出せずに落ちる（10/13 #151〜#153）。履歴を全部取る。
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pyflakes pyyaml pillow pytest imageio_ffmpeg 'cryptography>=46,<50'

      - name: Install Japanese fonts for diagram checks
        # 同梱の日本語字体を使い、aptの通信状態に検査結果を左右させない。
        # 欠落・破損・日本語の無い字体はここで失敗させる。
        run: |
          python scripts/check_diagram_font.py
          font_dir="$HOME/.local/share/fonts/collespo"
          mkdir -p "$font_dir"
          cp assets/fonts/soccer-v5/NotoSansJP-VF.ttf "$font_dir/"
          fc-cache -f "$font_dir"
          echo "COLLESPO_FONT=$GITHUB_WORKSPACE/assets/fonts/soccer-v5/NotoSansJP-VF.ttf" >> "$GITHUB_ENV"

      - name: Run checks
        run: python scripts/run_checks.py

      - name: Check interactive pages and appearance preferences
        run: node --test scripts/test_web_*.cjs
