name: 型ごとの週次レポート
on:
  schedule:
    - cron: '0 1 * * 1' # 月曜10:00 JST
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 固定材料の検査
        run: |
          python -m pip install pytest
          python scripts/test_weekly_report.py
      - name: 前の日曜までのレポート
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          END=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          python scripts/weekly_report.py --data data --end "$END" --out "docs/weekly/$DAY.md"
      - name: レポートを保存
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: docs/weekly/*.md
          retention-days: 30
