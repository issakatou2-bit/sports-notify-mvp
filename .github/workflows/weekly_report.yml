name: 型ごとの週次レポート
on:
  schedule:
    - cron: '0 1 * * 1' # 月曜10:00 JST
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: weekly-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 固定材料の検査
        run: |
          python -m pip install pytest
          python scripts/test_weekly_report.py
      - name: 前の日曜までのレポート
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          END=$(TZ=Asia/Tokyo date -d 'yesterday' +%F)
          python scripts/weekly_report.py --data data --end "$END" --out "docs/weekly/$DAY.md"
      - name: レポートを保存
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/weekly
          if ! git diff --cached --quiet; then
            git commit -m "型ごとの週次レポート $(TZ=Asia/Tokyo date +%F)"
            git push
          fi
