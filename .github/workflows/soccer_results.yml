name: 毎朝 8:00　欧州サッカーの結果

on:
  schedule:
    - cron: '20 22 * * *'  # JST 7:20。締め7:15、公開8:00（共通表と検査で照合）
  workflow_dispatch:
    inputs:
      date:
        description: 終了した日本時間の日（空なら前日）
        type: string
        required: false
        default: ''
      publish:
        description: YouTubeへ上げる（公開設定はprivacyで選ぶ）
        type: boolean
        required: true
        default: false
      privacy:
        description: 公開設定（privateは非公開試験・予約公開なし）
        type: choice
        required: true
        default: public
        options: [public, private]
      publish_at:
        description: 予約する日本時間 HH:MM（公開する場合は未来の時刻）
        type: string
        required: false
        default: ''

permissions:
  contents: write
concurrency:
  group: soccer-results
  cancel-in-progress: false

env:
  COLLESPO_HOST_SPLIT: ${{ vars.COLLESPO_HOST_SPLIT || '' }}
  COLLESPO_UI_VOICE_STOCK: ${{ vars.COLLESPO_UI_VOICE_STOCK || '' }}
  COLLESPO_UI_PARTS_KEY: ${{ secrets.COLLESPO_UI_PARTS_KEY }}
  COLLESPO_UI_VOICE_WAIT_MINUTES: ${{ vars.COLLESPO_UI_VOICE_WAIT_MINUTES || '15' }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.SOCCER_RESULTS_PUBLISH == 'true'
    runs-on: ubuntu-latest
    env:
      COLLESPO_BUBBLE: ${{ vars.COLLESPO_BUBBLE || '' }}
      COLLESPO_MOTION: ${{ vars.COLLESPO_MOTION || '' }}
      COLLESPO_CAPTION_BREAKS: ${{ vars.COLLESPO_CAPTION_BREAKS || '' }}
      COLLESPO_SLANT_VARIANT: ${{ vars.COLLESPO_SLANT_VARIANT || 'cream' }}
      COLLESPO_GLASS_BACKGROUND: ${{ vars.COLLESPO_GLASS_BACKGROUND || 'stripes' }}
      COLLESPO_OUTRO_NEXT: ${{ vars.COLLESPO_OUTRO_NEXT == 'on' && 'on' || 'off' }}
      COLLESPO_SHORT_LOOK: v4
      COLLESPO_SOCCER_TITLE_V2: ${{ vars.COLLESPO_SOCCER_TITLE_V2 == 'on' && 'on' || 'off' }}
      COLLESPO_SOCCER_LOOK: ${{ vars.COLLESPO_SOCCER_LOOK || 'v4' }}
      COLLESPO_SOCCER_FOCUS: ${{ vars.COLLESPO_SOCCER_FOCUS == 'on' && 'on' || 'off' }}
      COLLESPO_DUO: 'off'
      COLLESPO_EXPR: ${{ vars.COLLESPO_EXPR || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install imageio_ffmpeg pyyaml
      - name: Fetch results
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          RESULT_DAY: ${{ inputs.date }}
        run: |
          args=()
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then args+=(--scheduled); fi
          if [ -n "$RESULT_DAY" ]; then args=(--date "$RESULT_DAY"); fi
          python scripts/soccer_results.py "${args[@]}" --out data/soccer_results.json
      - name: Optional TheSportsDB score second opinion
        if: vars.COLLESPO_THESPORTSDB_CHECK == 'on'
        continue-on-error: true
        env:
          COLLESPO_THESPORTSDB_CHECK: ${{ vars.COLLESPO_THESPORTSDB_CHECK }}
        run: python scripts/thesportsdb_check.py
      - name: Stop when neither preview results nor player results exist
        id: gate
        run: |
          COUNT=$(python -c "import json; d=json.load(open('data/soccer_results.json',encoding='utf-8')); print(int(d['can_make']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then echo "::notice::終了した注目試合/日本人選手の結果がありません。動画を作りません"; fi
      - name: Install video tools
        if: steps.gate.outputs.count != '0'
        run: bash scripts/install_video_tools.sh
      # 画面の検査は日本語の書体が要るので、道具（書体）を入れたあと（10/10 初回の実行で書体なしで落ちた）
      - name: Inspect material and drawing
        if: steps.gate.outputs.count != '0'
        run: python scripts/test_soccer_results.py --material data/soccer_results.json
      - name: Start VOICEVOX
        if: steps.gate.outputs.count != '0'
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:50021/version > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:50021/version
      - name: Create narration
        if: steps.gate.outputs.count != '0'
        run: python scripts/soccer_results_render.py --data data/soccer_results.json --narration-out build/soccer_results/narration.json
      - name: Synthesize narration
        if: steps.gate.outputs.count != '0'
        run: python scripts/synthesize_narration.py --narration build/soccer_results/narration.json --out-dir build/soccer_results/audio
      - name: Fit the story to measured audio
        if: steps.gate.outputs.count != '0'
        run: python scripts/soccer_result_story.py --narration build/soccer_results/narration.json --audio-dir build/soccer_results/audio
      - name: Render and measure 60 seconds
        if: steps.gate.outputs.count != '0'
        run: python scripts/soccer_results_render.py --data data/soccer_results.json --audio-dir build/soccer_results/audio --out build/soccer_results
      - name: Capture visual contact sheets (non-blocking)
        if: steps.gate.outputs.count != '0'
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/visual_capture.py video --video build/soccer_results/collespo_soccer_results.mp4 --out build/visual/$(TZ=Asia/Tokyo date +%Y%m%d)
      - name: Save visual contact sheets
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: visual-soccer-results
          path: |
            build/visual/**/video/*-contact-*.jpg
            !build/**/portrait/**
          retention-days: 7
          if-no-files-found: ignore
      - name: Sanity gate (soccer_results)
        id: sanity
        if: steps.gate.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/sanity.py --general --strict --narration build/soccer_results/narration.json --out data/sanity_soccer_results.json --hold-record build/sanity_hold_soccer_results.json --kind soccer_results

      - name: Vertical thumbnail
        if: steps.gate.outputs.count != '0'
        run: bash scripts/shorts_thumbnail.sh build/soccer_results/collespo_soccer_results.mp4 build/soccer_results/short.png
      - name: Require a future reservation
        if: (github.event_name == 'schedule' && vars.SOCCER_RESULTS_PUBLISH == 'true' || github.event_name == 'workflow_dispatch' && inputs.publish && inputs.privacy != 'private') && steps.gate.outputs.count != '0'
        env:
          PUBLISH_AT: ${{ inputs.publish_at }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then PUBLISH_AT=$(python scripts/soccer_results_clock.py); export PUBLISH_AT; fi
          python -c "import os,sys; sys.path.insert(0,'scripts'); import upload_youtube as u; assert os.environ['PUBLISH_AT'] and u.resolve_publish_at(os.environ['PUBLISH_AT']), '未来の予約時刻を指定してください'"
      - name: Upload to YouTube
        if: (github.event_name == 'schedule' && vars.SOCCER_RESULTS_PUBLISH == 'true' || github.event_name == 'workflow_dispatch' && inputs.publish) && steps.gate.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PUBLISH_AT: ${{ inputs.publish_at }}
          EVENT_NAME: ${{ github.event_name }}
          PRIVACY: ${{ github.event_name == 'workflow_dispatch' && inputs.privacy || 'public' }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then PUBLISH_AT=$(python scripts/soccer_results_clock.py); export PUBLISH_AT; fi
          args=(--privacy "$PRIVACY")
          if [ "$PRIVACY" != private ]; then args+=(--publish-at "$PUBLISH_AT"); fi
          RESULT_KEY=$(python -c "import json; print(json.load(open('data/soccer_results.json',encoding='utf-8'))['date_jst'])")
          python scripts/soccer_results_upload.py --video build/soccer_results/collespo_soccer_results.mp4 \
            --kind soccer_results --sport soccer --games data/soccer_results.json \
            --video-date "$RESULT_KEY" \
            --narration build/soccer_results/narration.json --thumbnail build/soccer_results/short.png \
            "${args[@]}"
      - name: Commit record
        if: always()
        run: |
          bash scripts/commit_data.sh "soccer results: ${{ github.run_id }}" \
            data/soccer_results.json data/published_videos.json data/token_usage.json
      - name: Save video and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soccer-results
          path: |
            build/soccer_results/
            data/soccer_results.json
            !build/**/portrait/**
          if-no-files-found: ignore
      - name: Confirm reservation
        if: (github.event_name == 'schedule' && vars.SOCCER_RESULTS_PUBLISH == 'true' || github.event_name == 'workflow_dispatch' && inputs.publish && inputs.privacy != 'private') && steps.gate.outputs.count != '0'
        run: python scripts/verify_published.py --kind soccer_results --games data/soccer_results.json

      - name: Keep unsaved data records
        if: always() && hashFiles('build/data-save-recovery/**/FAILED') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-data-${{ github.job }}-${{ github.run_attempt }}
          path: |
            build/data-save-recovery/
            !build/**/portrait/**
          retention-days: 14
          if-no-files-found: error

      - name: Save sanity gate records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-gate-${{ github.job }}
          path: |
            data/sanity*.json
            build/sanity*hold*.json
            !build/**/portrait/**
          retention-days: 14

      - name: Save quota-exceeded thumbnails
        if: always() && hashFiles('build/thumbnail_pending/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-pending
          path: |
            build/thumbnail_pending/
            !build/**/portrait/**
          retention-days: 3
          if-no-files-found: ignore

      - name: Save voice and render records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-render-records-${{ github.job }}-${{ github.run_attempt }}
          path: |
            build/**/voice_manifest.json
            build/**/render_timeline.json
            !build/**/portrait/**
          retention-days: 14
          if-no-files-found: ignore
