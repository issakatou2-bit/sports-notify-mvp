name: MLB 移籍・契約ニュース見張り

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: market-watch
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  COLLESPO_MARKET_AUTO_PUBLISH: ${{ vars.COLLESPO_MARKET_AUTO_PUBLISH }}
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      topic: ${{ steps.watch.outputs.topic }}
      publish: ${{ steps.watch.outputs.publish }}
      material: ${{ steps.watch.outputs.material }}
      issue: ${{ steps.issue.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Collect reports and prepare drafts
        id: watch
        run: |
          python scripts/news_fast_watch.py mlb --out build/market_watch \
            --state data/market_watch_news_state.json --preview-receipts data/market_watch_news_previews.json \
            --large-material data/mlb_large_contracts.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Notify new reports
        id: issue
        if: steps.watch.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="MLB 移籍・契約ニュース見張り"
          if grep -q '^### 確認待ち ' build/market_watch/issues.md; then TITLE="確認待ち $TITLE"; fi
          echo >> build/market_watch/issues.md
          echo "下書きと照合記録はこの実行の artifact に保存します。" >> build/market_watch/issues.md
          URL="$(gh issue create --title "$TITLE $(TZ=Asia/Tokyo date +'%m/%d %H:%M')" --body-file build/market_watch/issues.md)"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Save the seen state
        run: |
          bash scripts/commit_data.sh "market_watch: ${{ github.run_id }}" data/market_watch_news_state.json data/mlb_large_contracts.json
      - name: Save drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-watch-drafts
          path: |
            build/market_watch/
            !build/**/portrait/**
          retention-days: 14
      - name: Keep unsaved data records
        if: always() && hashFiles('build/data-save-recovery/**/FAILED') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-data-watch-${{ github.run_attempt }}
          path: |
            build/data-save-recovery/
            !build/**/portrait/**
          retention-days: 14
          if-no-files-found: error

  topic:
    needs: watch
    if: needs.watch.outputs.topic != ''
    uses: ./.github/workflows/mlb_market_topics.yml
    with:
      topic: ${{ needs.watch.outputs.topic }}
      automatic_material: ${{ needs.watch.outputs.material }}
      publish: ${{ needs.watch.outputs.publish == 'true' }}
      news_issue: ${{ needs.watch.outputs.issue }}
    secrets: inherit
