name: MLB 日本人選手と大型契約の移籍報道 見張り（下書きのみ）

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: market-watch
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r scripts/requirements.txt
      - name: Collect public RSS and draft
        id: watch
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          python scripts/market_watch.py --out build/market_watch --state data/market_watch_state.json --large-material data/mlb_large_contracts.json | tee build/market_watch_stdout.txt
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r = json.load(open('build/market_watch/market_watch_report.json', encoding='utf-8'))
          print(f"new={r['stage1'] + r['stage2']}")
          PY
      # 15分ごとに記録を積まない。新しい話が出た時だけ保存する（11/25）。
      - name: Save the seen-state
        if: steps.watch.outputs.new != '0' && steps.watch.outputs.new != ''
        run: |
          bash scripts/commit_data.sh "market watch: ${{ github.run_id }}" data/market_watch_state.json data/mlb_large_contracts.json
      # 新しい話は課題で知らせる（本人と Claude が見る）。公開はしない。確かめてから材料へ足す。
      - name: Notify new reports
        if: steps.watch.outputs.new != '0' && steps.watch.outputs.new != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "移籍報道の見張りが新しい話を見つけました（run ${{ github.run_id }}）。"
            echo
            echo '```'
            cat build/market_watch_stdout.txt
            echo '```'
            echo
            echo "下書き：この run の artifact「market-watch-drafts」。日本人選手の話題は出典を開いて確かめてから data/mlb_market_followups.json へ足す。大型契約は段2の保存項目を確認し、followup- を付けた鍵で見本を作れる。"
          } > build/market_watch_issue.md
          gh issue create --title "移籍報道 $(TZ=Asia/Tokyo date +%m/%d\ %H:%M)" --body-file build/market_watch_issue.md
      - name: Save drafts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-watch-drafts
          path: build/market_watch/
          retention-days: 14
      - name: Keep unsaved data records
        if: always() && hashFiles('build/data-save-recovery/**/FAILED') != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsaved-data-${{ github.job }}-${{ github.run_attempt }}
          path: |
            build/data-save-recovery/
            !build/**/portrait/**
          retention-days: 14
          if-no-files-found: error
