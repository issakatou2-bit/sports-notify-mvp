name: 道具　新しい材料が取れるか試す

# 新しい競技を足す前に、その材料が本当に取れるのかをランナーから確かめる。
#
# 手元(日本の回線)からはNBAのCDNが403を返すが、実際に動かすのはこの
# ランナー(米国)なので、ここでの結果が判断材料になる。
# 「たぶん取れる」で実装を始めて、あとから取れないと分かるのがいちばん高い。

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 追加の物が要る。
      #
      # 最初の2本は urllib だけで書いてあり、入れる段が無かった。
      # そこへ requests を使う3本目を足したので、import の時点で
      # 落ちて、要約に1行も出ないまま終わっていた。
      # 出力が無いのは「取れなかった」ではなく「動かなかった」だった。
      - name: Install
        run: pip install -r scripts/requirements.txt
      - name: Probe
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/probe_sources.py --out probe_result.json

      # サッカーの中身が取れるか。NBAの到達性とは別の問いなので
      # 別の台本にしてある。片方が落ちても、もう片方は動く。
      - name: Probe soccer detail
        if: always()
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/probe_soccer.py
      # 日本人選手が活躍した試合のハイライトに、コメントが付くか。
      # 称賛だけを別動画にする案が成り立つかは、ここで決まる。
      - name: Probe jp highlight
        if: always()
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/probe_jp_highlight.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-result
          path: probe_result.json
          if-no-files-found: ignore
