name: 非公開試作 観戦の見取り図

on:
  workflow_dispatch:
    inputs:
      episode:
        description: 'auto＝未投稿の確認済み原稿を1本。企画IDでも指定できます'
        type: string
        default: auto
      upload:
        description: 'YouTubeへ非公開で投稿。falseは動画ファイルの生成だけ'
        type: boolean
        default: true
  schedule:
    - cron: '17 8 * * 2'

# 毎週火曜17:17 JSTごろ、確認済みの未投稿原稿を1本だけ。
# 原稿が尽きたら何も作らない。公開・SNS配信へ切り替える入力は設けない。
permissions:
  contents: write

concurrency:
  group: private-pilot-series
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - name: 制作と投稿の道具
        run: python -m pip install 'pillow>=10,<13' google-api-python-client google-auth
      - name: 原稿と既存の非公開投稿を照合
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          EPISODE: ${{ inputs.episode || 'auto' }}
          UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: |
          options=()
          if [ "$UPLOAD" != 'true' ]; then options+=(--render-only); fi
          python scripts/pilot_upload.py prepare --episode "$EPISODE" --out build/pilot "${options[@]}"
      - name: 映像と日本語フォントの道具
        if: steps.plan.outputs.build == 'true'
        timeout-minutes: 9
        run: |
          sudo timeout 180 apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=30
          sudo timeout 240 apt-get install -y -qq ffmpeg fonts-noto-cjk
      - name: 音声エンジンを起動
        if: steps.plan.outputs.build == 'true'
        timeout-minutes: 8
        run: |
          docker run -d --rm -p 127.0.0.1:50021:50021 --name pilot-voicevox voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:50021/version >/dev/null; then exit 0; fi
            sleep 2
          done
          echo '音声エンジンが起動しませんでした'
          exit 1
      - name: 原稿の期限と図を検査
        if: steps.plan.outputs.build == 'true'
        env:
          EPISODE: ${{ steps.plan.outputs.episode }}
        run: |
          python scripts/pilot_series.py validate --episode "$EPISODE"
          python scripts/pilot_series.py preview --episode "$EPISODE" --out build/pilot
      - name: 音声を作り字幕の時刻を決定
        if: steps.plan.outputs.build == 'true'
        env:
          EPISODE: ${{ steps.plan.outputs.episode }}
        run: python scripts/pilot_series.py synthesize --episode "$EPISODE" --out build/pilot
      - name: 図解の映像を作り画質と音量を検査
        if: steps.plan.outputs.build == 'true'
        env:
          EPISODE: ${{ steps.plan.outputs.episode }}
        run: |
          python scripts/pilot_series.py render --episode "$EPISODE" --out build/pilot
          python scripts/pilot_series.py verify --episode "$EPISODE" --out build/pilot
      - name: 非公開で投稿し処理結果を照合
        if: steps.plan.outputs.build == 'true' && (github.event_name == 'schedule' || inputs.upload)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/pilot_upload.py upload --out build/pilot
      # 公開repoのartifactはログインした読取者も取得できる。映像を残さない。
      - name: 検査結果だけを保存
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pilot-receipts-${{ github.run_id }}
          path: |
            build/pilot/plan.json
            build/pilot/quality.json
            build/pilot/upload-receipt.json
          retention-days: 30
          if-no-files-found: warn
      - name: 完成素材を保存（非公開リポジトリのみ）
        if: always() && github.event.repository.private == true
        uses: actions/upload-artifact@v7.0.1
        with:
          name: private-pilot-media-${{ github.run_id }}
          path: build/pilot/
          retention-days: 30
          if-no-files-found: warn
      - name: 結果を表示
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          out = pathlib.Path('build/pilot')
          lines = ['## 観戦の見取り図（非公開試作）', '公開設定はprivateに固定。SNS配信・公開予約はありません。',
                   '公開リポジトリには検査結果だけを保存します。完成映像は所有者のYouTube Studioから確認してください。']
          for name in ['plan.json', 'quality.json', 'upload-receipt.json']:
              if (out / name).exists():
                  value = json.loads((out / name).read_text(encoding='utf-8'))
                  lines.extend(['', name, '```json', json.dumps(value, ensure_ascii=False, indent=2), '```'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              for line in lines:
                  print(line, file=f)
          PY
