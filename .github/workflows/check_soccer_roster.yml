name: 道具　サッカーの日本人選手名簿を確かめる

# JP_PLAYERS_SOCCER は手で書いた25人の名簿で、自動では更新されない。
# 定義のコメントに「移籍市場の閉幕後にもう一度確認すること」とあるが、
# 市場は9月2日に閉じ、名簿は8月11日を最後に触られていない。
#
# 所属が違えば、その日の題も画面も読み上げも全部間違う。
# 題は日本人選手名で作っていて、この番組でいちばん効いている材料。
#
# 直しはしない。差分を出すだけ。名簿はコードなので、人が見てから直す。

on:
  workflow_dispatch: {}
  # 移籍市場が閉じたころに、自分から知らせる。
  # 夏は9月上旬、冬は2月上旬。月初の実行で足りる。
  schedule:
    - cron: '0 1 3 2,9 *'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check the roster
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python scripts/check_soccer_roster.py | tee "$GITHUB_STEP_SUMMARY"
