name: 毎朝 10:00　健康診断(前日分)

# 昨日、出るべきものが出たかを確認する。
#
# ワークフローが成功で終わることと、結果が残っていることは別。
# 1日で8件の不具合が見つかった日があるが、全部「成功」で終わっていた。
# 動画が投稿直前に捨てられ、記録が4日間止まり、採点ルールが1つも
# 発火していなかった。実行ログを見ても気づけない類のもので、
# 結果の側から見るしかない。
#
# 欠けていれば赤で終わる。Actionsの一覧に赤が並べば、それが合図になる。
#
# 時刻は正確でなくてよいので、GitHub純正のscheduleで足りる
# (数時間遅れても、昨日の結果を見ることに変わりはない)。

on:
  schedule:
    - cron: '0 1 * * *'   # UTC 1:00 = JST 10:00
  workflow_dispatch:
    inputs:
      date:
        description: '確認する日 (YYYY-MM-DD、既定は昨日)'
        required: false

# 取った数字を data/analytics.json へ残すので write が要る。
# 積み上がって初めて「変えた翌日に動いたか」が比べられる。
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # 動画ごとの数字を取ってから診断する。
      # これまで人が Studio の画面から書き写していた。
      # 自動で残れば、1枚目を変えた翌日に動いたかを機械的に比べられる。
      # 権限が無い間は静かに飛ぶ(診断そのものは止めない)。
      - name: Fetch per-video numbers
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/fetch_analytics.py --days 28

      # 上が落ちても回は緑になる。だから落ちたことを別に見張る。
      #
      # 実際 data/analytics.json は8/19の1回きりで、そのあと2日ぶん
      # 静かに欠けていた。数字を見ようとした日に初めて気づくのでは、
      # 判断のもとが無い状態で2日過ごすことになる。
      - name: Warn if the numbers went stale
        if: always()
        run: python scripts/analytics_age.py

      # 記録が落ちた日を、チャンネルの一覧から埋め直す。
      #
      # 8/17と8/18の朝の回は6本すべて公開されているのに、押し合いで
      # 記録だけが残らなかった。原因は直したが、落ちたぶんは戻らない。
      # 動画は実在するので、RSSから読み直して埋める。
      # 鍵も割り当ても要らないので、毎朝走らせて構わない。
      - name: Backfill lost records
        continue-on-error: true
        run: python scripts/backfill_records.py --write

      - name: Check
        env:
          DAY: ${{ inputs.date }}
        run: |
          if [ -n "$DAY" ]; then
            python scripts/healthcheck.py --date "$DAY"
          else
            python scripts/healthcheck.py
          fi

      # 取った数字を残す。1日ぶんだけでは比べようがない。
      - name: Commit the numbers
        if: always()
        continue-on-error: true
        run: |
          bash scripts/commit_data.sh             "analytics: ${{ github.run_id }}"             data/analytics.json data/published_videos.json
