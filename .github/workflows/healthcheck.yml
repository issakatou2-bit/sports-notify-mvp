name: 毎朝 10:00　健康診断(前日分)

# 昨日、出るべきものが出たかを確認する。
#
# ワークフローが成功で終わることと、結果が残っていることは別。
# 1日で8件の不具合が見つかった日があるが、全部「成功」で終わっていた。
# 動画が投稿直前に捨てられ、記録が4日間止まり、採点ルールが1つも
# 発火していなかった。実行ログを見ても気づけない類のもので、
# 結果の側から見るしかない。
#
# 欠けていれば赤で終わる。Actionsの一覧に赤が並べば、それが合図になる。
#
# 起動は cron-job.org から(01:00 UTC = JST 10:00)。
#
# 純正の schedule を使っていたが、遅れるだけでなく実行そのものを飛ばす。
# 資産動画は同じ理由で8/12から8/18まで7日間1本も出ていなかった。
# 診断が飛ぶのがいちばん困る——飛んだことを報せる仕組みが診断だから。
#
# 日次の完了に連鎖させてはいけない。日次が失敗した日にこそ動いてほしい。

on:
  workflow_dispatch:
    inputs:
      date:
        description: '確認する日 (YYYY-MM-DD、既定は昨日)'
        required: false

# 取った数字を data/analytics.json へ残すので write が要る。
# 積み上がって初めて「変えた翌日に動いたか」が比べられる。
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 動画ごとの数字を取るのに Google のライブラリが要る。
      #
      # ここに入れる段が無かった。fetch_analytics.py は
      # 取り込みに失敗すると警告を1行出して exit 0 で抜けるので、
      # 段は緑、回も緑、要約には前回の数字がそのまま出る。
      # そうやって8/19から6日間止まっていた。
      #
      # 原因を「トークンの失効」だと読んでいたが違った。
      # 認証まで辿り着いてもいなかった。
      - name: Install
        run: pip install -r scripts/requirements.txt
      # 動画ごとの数字を取ってから診断する。
      # これまで人が Studio の画面から書き写していた。
      # 自動で残れば、1枚目を変えた翌日に動いたかを機械的に比べられる。
      # 権限が無い間は静かに飛ぶ(診断そのものは止めない)。
      - name: Fetch per-video numbers
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: python scripts/fetch_analytics.py --days 28

      # 上が落ちても回は緑になる。だから落ちたことを別に見張る。
      #
      # 実際 data/analytics.json は8/19の1回きりで、そのあと2日ぶん
      # 静かに欠けていた。数字を見ようとした日に初めて気づくのでは、
      # 判断のもとが無い状態で2日過ごすことになる。
      - name: Warn if the numbers went stale
        if: always()
        run: python scripts/analytics_age.py

      # 記録が落ちた日を、チャンネルの一覧から埋め直す。
      #
      # 8/17と8/18の朝の回は6本すべて公開されているのに、押し合いで
      # 記録だけが残らなかった。原因は直したが、落ちたぶんは戻らない。
      # 動画は実在するので、RSSから読み直して埋める。
      # 鍵も割り当ても要らないので、毎朝走らせて構わない。
      # 初動。維持率はAnalyticsが要るが、再生数は APIキーだけで取れる。
      # トークンが効かない間も、配られたかどうかはこれで分かる。
      - name: Early views
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/early_views.py --days 7

      - name: Backfill lost records
        continue-on-error: true
        run: python scripts/backfill_records.py --write

      # 立場の違う5人が、昨日出したものを見て指摘する。
      #
      # 数字は「どうだったか」しか教えない。維持率が16%だと分かっても、
      # 何をどう直すかは出てこない。人が見れば言えることが、
      # 誰も見ていないので言われないまま毎日過ぎていた。
      #
      # 「返信が54件ついた一言があります」で始まる回は4日出続けたし、
      # 英語で切れた題もそのまま投稿された。見た人がいなかったから。
      #
      # 出るのは制作側への指摘で、動画には入れない。
      # 講評が落ちても診断は続ける(そちらが本体)。
      - name: Review board
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/review_board.py

      - name: Check
        env:
          DAY: ${{ inputs.date }}
        run: |
          if [ -n "$DAY" ]; then
            python scripts/healthcheck.py --date "$DAY"
          else
            python scripts/healthcheck.py
          fi

      # 取った数字を残す。1日ぶんだけでは比べようがない。
      - name: Commit the numbers
        if: always()
        continue-on-error: true
        run: |
          bash scripts/commit_data.sh             "analytics: ${{ github.run_id }}"             data/analytics.json data/published_videos.json data/early_views.json
