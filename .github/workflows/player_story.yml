name: 日本人選手のいまの流れ（既定オフ）
on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: player-story
  cancel-in-progress: false
jobs:
  build:
    if: vars.COLLESPO_PLAYER_STORY == 'on'
    runs-on: ubuntu-latest
    env:
      COLLESPO_PLAYER_STORY: ${{ vars.COLLESPO_PLAYER_STORY || 'off' }}
      PLAYER_STORY_PUBLISH: ${{ vars.PLAYER_STORY_PUBLISH || 'false' }}
      COLLESPO_EXPR: ${{ vars.COLLESPO_EXPR || '' }}
      COLLESPO_BUBBLE: ${{ vars.COLLESPO_BUBBLE || '' }}
      COLLESPO_CAPTION_BREAKS: ${{ vars.COLLESPO_CAPTION_BREAKS || '' }}
      COLLESPO_SLANT_VARIANT: ${{ vars.COLLESPO_SLANT_VARIANT || 'cream' }}
      COLLESPO_GLASS_BACKGROUND: ${{ vars.COLLESPO_GLASS_BACKGROUND || 'stripes' }}
      COLLESPO_SHORT_LOOK: v4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install imageio_ffmpeg
      - name: Select a story from saved reports and official numbers
        run: python scripts/player_story.py --fetch-stats --out build/player_story/narration.json
      - name: Stop without numeric flow or player reporting
        id: gate
        run: |
          COUNT=$(python -c "import json; print(int(json.load(open('build/player_story/narration.json',encoding='utf8'))['can_make']))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
      - name: Install video tools
        if: steps.gate.outputs.count == '1'
        run: bash scripts/install_video_tools.sh
      - name: Start VOICEVOX
        if: steps.gate.outputs.count == '1'
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:50021/version > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:50021/version
      - name: Synthesize and render
        if: steps.gate.outputs.count == '1'
        run: |
          python scripts/synthesize_narration.py --narration build/player_story/narration.json --out-dir build/player_story/audio
          python scripts/player_story_render.py --narration build/player_story/narration.json --audio-dir build/player_story/audio --out build/player_story
      - name: Publish only when explicitly enabled
        if: steps.gate.outputs.count == '1' && vars.PLAYER_STORY_PUBLISH == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          DAY=$(python -c "import json; print(json.load(open('build/player_story/narration.json',encoding='utf8'))['label'])")
          python scripts/upload_youtube.py --kind player_story --video build/player_story/collespo_player_story.mp4 --games build/player_story/narration.json --narration build/player_story/narration.json --video-date "$DAY" --privacy public
          bash scripts/commit_data.sh "player story: ${{ github.run_id }}" \
            data/published_videos.json data/local_reporters.json data/local_buzz.json data/local_voices.json
      - name: Save preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-story-preview
          path: build/player_story/
          if-no-files-found: ignore
