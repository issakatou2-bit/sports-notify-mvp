name: Player recap

# 「その日の日本人選手の成績」を配信する。
# 19時の予告(これから起きること)に対して、こちらは結果(終わったこと)。
#
# 実行タイミング: UTC 7:00 = JST 16:00
#
#   当初はJST 8:00にしていたが、これは誤りだった。米国日付Dのナイトゲームは
#   現地19時開始なので、日本時間では次のような並びになる:
#     東部 19:00開始 → JST 08:00開始 / 11:00終了
#     太平洋 19:00開始 → JST 11:00開始 / 14:00終了
#   つまりJST 8:00は「東部の試合がちょうど始まる時刻」で、対象日の試合は
#   1つも終わっていない。全試合が出揃うのはJST 14時ごろになる。
#
#   16:00にしているのは、最も遅い試合の終了から2時間の余裕を取るため
#   (延長戦があっても間に合う)。19時の配信とも3時間空く。
#
#   19時の配信と違って分単位の正確さは要らないので、ここでは
#   GitHub純正のscheduleを使う(純正は数時間遅れることがある)。
#   遅延が実際に問題になるようなら、日次と同じくcron-job.orgへ移すこと。

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch: {}

# 取得した結果を data/ へコミットするため
permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      - name: Install video tools
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh

      # 出場した選手が1人もいない日(オールスター休みなど)は、
      # ここでファイルが更新されず、以降のステップが自然に何も作らない
      - name: Fetch last night's results
        run: python scripts/morning_recap.py --out data/morning_recap.json

      # 球場ごとの実測(1試合平均得点)。日次の注目試合の解説や資産動画が
      # これを読むが、更新する場所がどこにも無いと古い数字を使い続けてしまう。
      # 16時の時点では前日の試合が確定しているので、ここで取り直すのが都合がよい。
      # 失敗しても、前回コミットした分がそのまま使われる。
      - name: Update venue stats
        continue-on-error: true
        run: python scripts/venue_stats.py --out data/venue_stats.json

      # 現地でどの試合が最も見られたか。公式ハイライトの再生回数を使う。
      # SNSの書き込みを拾うのと違い、誰でも同じ数字を確認できる。
      - name: Fetch local attention
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/mlb_buzz.py --out data/mlb_buzz.json

      # 現地のコミュニティと報道で、どのチームの名前が挙がったか。
      # 投稿の文面は引用せず回数だけを数えるので、翻訳の加減が入らない。
      # 再生回数(見られた量)とは別の軸で、こちらは語られた量にあたる。
      - name: Fetch local talk
        continue-on-error: true
        run: python scripts/local_buzz.py --out data/local_buzz.json

      # 現地のファンが実際に何と言っているか。翻訳を通すので、
      # 数字のコーナーとは別枠として扱う(画面も背景色を変えて分ける)。
      - name: Fetch local voices
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/local_voices.py --out data/local_voices.json

      # 現地の番記者が今日書いたこと。ファンの声(local_voices)とは別で、
      # その球団を毎日追っている人が実名で書いている一次情報。
      # Blueskyの公開エンドポイントは認証が要らないので鍵も不要。
      - name: Fetch local reporters
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/local_reporters.py --out data/local_reporters.json

      - name: Start VOICEVOX engine
        continue-on-error: true
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox \
            voicevox/voicevox_engine:cpu-latest || \
            echo "::warning::VOICEVOXの起動に失敗しました。音声なしで進めます"
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      # 選手成績と現地の注目度を1本にまとめると76秒・7画面になり、
      # 主題が3つ混ざってタイトルもサムネイルも1つしか表せなくなる。
      # 実際、最も見られた動画は単一主題のもので、情報を詰めたものほど
      # 視聴率が落ちていた。2本に分けて、それぞれ主題を1つにする。
      - name: Build and upload both shorts
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          set +e
          for mode in players local press; do
            echo "::group::$mode"
            if [ "$mode" = "players" ]; then
              VIDEO="build/morning/collespo_morning.mp4"
            else
              VIDEO="build/morning/collespo_morning_${mode}.mp4"
            fi

            python scripts/generate_morning_short.py \
              --recap data/morning_recap.json --mode "$mode" \
              --narration-out "build/mr_narration_${mode}.json"
            if [ ! -f "build/mr_narration_${mode}.json" ]; then
              echo "素材が無いため $mode は作りません"
              echo "::endgroup::"; continue
            fi

            python scripts/synthesize_narration.py \
              --narration "build/mr_narration_${mode}.json" \
              --out-dir "build/mr_audio_${mode}"

            python scripts/generate_morning_short.py \
              --recap data/morning_recap.json --mode "$mode" \
              --audio-dir "build/mr_audio_${mode}" --out build/morning
            if [ $? -ne 0 ]; then
              echo "::warning::$mode の動画生成に失敗しました"
              echo "::endgroup::"; continue
            fi

            python scripts/generate_thumbnail.py \
              --kind "morning" --recap data/morning_recap.json \
              --mode "$mode" --out "build/morning/thumb_${mode}.png"

            python scripts/upload_youtube.py \
              --video "$VIDEO" --kind morning --morning-mode "$mode" \
              --recap data/morning_recap.json \
              --thumbnail "build/morning/thumb_${mode}.png" \
              --privacy public

            # TikTokへも同じものを出す。タイトルはYouTube側の記録から借りる。
            # 記録上の区分は players→morning / それ以外→morning_<mode>。
            if [ -n "$TIKTOK_REFRESH_TOKEN" ]; then
              if [ "$mode" = "players" ]; then TK=morning; else TK="morning_${mode}"; fi
              python scripts/post_tiktok.py --video "$VIDEO" --kind "$TK"
            fi
            echo "::endgroup::"

            # 2本目は少し間を置く。同時に上げると初速が分散する
            [ "$mode" = "players" ] && sleep 60
          done
          set -e

      # 結果はサイトからも参照できるよう、リポジトリへ残す
      - name: Commit recap
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/morning_recap.json data/venue_stats.json \
            data/published_videos.json data/mlb_buzz.json \
            data/local_buzz.json data/published_tiktok.json \
            data/local_reporters.json data/recap_history/ || true
          git diff --cached --quiet || git commit -m "recap: ${{ github.run_id }}"
          git pull --rebase --quiet || true
          git push || echo "変更が無いか、push対象が無いためスキップ"

      - name: Save video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collespo-morning
          path: build/morning/collespo_morning.mp4
          retention-days: 7
          if-no-files-found: ignore
