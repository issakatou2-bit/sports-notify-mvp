# Actionsの一覧にはこの name が出る。ファイル名(morning_recap.yml)では
# 探せないので、中身と揃えておく。以前は Player recap のままで、
# 5本を作るようになったあとも古い名前が残り、探しても見つからなかった。
name: 毎日 17:00-18:00　夕方の4本

# 「その日の日本人選手の成績」を配信する。
# 19時の予告(これから起きること)に対して、こちらは結果(終わったこと)。
#
# 実行タイミング: UTC 7:00 = JST 16:00
#
#   当初はJST 8:00にしていたが、これは誤りだった。米国日付Dのナイトゲームは
#   現地19時開始なので、日本時間では次のような並びになる:
#     東部 19:00開始 → JST 08:00開始 / 11:00終了
#     太平洋 19:00開始 → JST 11:00開始 / 14:00終了
#   つまりJST 8:00は「東部の試合がちょうど始まる時刻」で、対象日の試合は
#   1つも終わっていない。全試合が出揃うのはJST 14時ごろになる。
#
#   16:00にしているのは、最も遅い試合の終了から2時間の余裕を取るため
#   (延長戦があっても間に合う)。19時の配信とも3時間空く。
#
#   起動は cron-job.org から。GitHub純正のscheduleは0〜4時間遅れる。
#
#   以前は両方を持っていた。外部cronが16:00に起動し、GitHubのscheduleも
#   同じ16:00指定で数時間遅れて起動する。同じ日に2回走ることになり、
#   1回目が失敗した日は2回目が夕方に成功して、朝の動画が19時台に出ていた。
#   起動口は1つにする。
#
#   起動時刻について:
#     最終試合の終了は実測14:25前後。データはそこで揃う。
#     16:00起動では16:30の公開予約に間に合わず、実際 morning だけ
#     予約が記録されておらず即時公開に倒れていた(press は21:00なので
#     余裕があり、毎日ぴったり出ている)。
#     動画ツールの導入だけで最大16分かかるので、余裕を90分取る。

on:
  workflow_dispatch:
    inputs:
      modes:
        description: '作る本数を絞る (players player voices press のうち必要なものだけ)'
        required: false
        default: 'players player voices press'
      player:
        description: '「今日の1人」をこの選手で作る (例: Pete Crow-Armstrong)'
        required: false
      force:
        description: 'true にすると、その日に投稿済みでも上げ直す'
        required: false
        default: 'false'

# 取得した結果を data/ へコミットするため
permissions:
  contents: write

jobs:
  morning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt
          pip install pillow google-api-python-client google-auth

      # その日のMLB全体を採点する。「今日の1人」がここから選ばれる。
      #
      # 日本人選手の名簿から順番に選ぶ作りにしていたが、この枠の趣旨は
      # 「MLB全体でその日いちばん活躍した選手」だった。8/17は
      # Pete Crow-Armstrong が154点で1位、大谷が140点で2位。
      # 名簿で絞ると、その日の1位が出てこない。
      - name: Score every MLB player today
        continue-on-error: true
        run: python scripts/best_of_day.py --out data/best_of_day.json

      # 「今日の1人」の材料。上の採点から選び、
      # 直近14日に出した人は飛ばす(同じ選手が連日続かないように)。
      - name: Pick today's player
        continue-on-error: true
        run: |
          python scripts/player_profile.py \
            --out data/player_profile.json \
            --history data/featured_players.json \
            --name "${{ inputs.player }}"

      # その日出た選手のカタカナ表記を集める。
      #
      # MLB公式APIは英語名しか返さない。画面に "Pete Crow-Armstrong" と
      # 出しても読みにくいし、読み上げは辞書に無い綴りを1文字ずつ読む。
      # Wikidataの日本語ラベルを引いて残しておく。一度引いた名前は
      # 二度と問い合わせないので、日に数件しか通信しない。
      # コメントで名前が挙がった選手を引くための表。
      #
      # ファンは出場していない選手の話もする(「降格するらしい」など)。
      # その日の出場者だけでは繋がらないので、コメントを集めた
      # 4試合の両チームぶん、在籍と今季成績を持っておく。
      - name: Fetch rosters for the commented games
        continue-on-error: true
        run: python scripts/roster_stats.py --buzz data/mlb_buzz.json

      - name: Fetch player readings
        continue-on-error: true
        run: python scripts/player_kana.py --from-recap

      # 成績データを常識で見ておく。ここは知らせるだけ。
      # 止めるのは1本ずつ、下のループの中で判断する——
      # 1行おかしいからといって、関係のない4本まで落とす理由はない。
      - name: Sanity check
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/sanity.py --narration

      - name: Install video tools
        timeout-minutes: 16
        run: bash scripts/install_video_tools.sh

      # 出場した選手が1人もいない日(オールスター休みなど)は、
      # ここでファイルが更新されず、以降のステップが自然に何も作らない
      - name: Fetch last night's results
        run: python scripts/morning_recap.py --out data/morning_recap.json

      # 球場ごとの実測(1試合平均得点)。日次の注目試合の解説や資産動画が
      # これを読むが、更新する場所がどこにも無いと古い数字を使い続けてしまう。
      # 16時の時点では前日の試合が確定しているので、ここで取り直すのが都合がよい。
      # 失敗しても、前回コミットした分がそのまま使われる。
      - name: Update venue stats
        continue-on-error: true
        run: python scripts/venue_stats.py --out data/venue_stats.json

      # 現地でどの試合が最も見られたか。公式ハイライトの再生回数を使う。
      # SNSの書き込みを拾うのと違い、誰でも同じ数字を確認できる。
      - name: Fetch local attention
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/mlb_buzz.py --out data/mlb_buzz.json

      # 現地のコミュニティと報道で、どのチームの名前が挙がったか。
      # 投稿の文面は引用せず回数だけを数えるので、翻訳の加減が入らない。
      # 再生回数(見られた量)とは別の軸で、こちらは語られた量にあたる。
      - name: Fetch local talk
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/local_buzz.py --out data/local_buzz.json

      # コメントを拾いにいく先を集める。MLB公式だけでなく、日本の配信元や
      # 球団公式も見る。RSSなので枠を使わない(検索は1回100ユニット)。
      - name: Collect videos from every source
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python scripts/channel_feeds.py \
            --sources data/comment_sources.json \
            --out data/channel_videos.json

      # 現地のファンが実際に何と言っているか。翻訳を通すので、
      # 数字のコーナーとは別枠として扱う(画面も背景色を変えて分ける)。
      #
      # 公式ハイライトのコメントを読むので、mlb_buzz.py の後に置く
      # (動画IDをあちらが取っている)。YOUTUBE_API_KEY はそのために要る。
      - name: Fetch local voices
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/local_voices.py --out data/local_voices.json

      # 現地の番記者が今日書いたこと。ファンの声(local_voices)とは別で、
      # その球団を毎日追っている人が実名で書いている一次情報。
      # Blueskyの公開エンドポイントは認証が要らないので鍵も不要。
      - name: Fetch local reporters
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/local_reporters.py --out data/local_reporters.json

      - name: Start VOICEVOX engine
        continue-on-error: true
        run: |
          docker run -d --rm -p 50021:50021 --name voicevox \
            voicevox/voicevox_engine:cpu-latest || \
            echo "::warning::VOICEVOXの起動に失敗しました。音声なしで進めます"
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:50021/version > /dev/null; then
              echo "VOICEVOX ready"; break
            fi
            sleep 2
          done

      # 選手成績と現地の注目度を1本にまとめると76秒・7画面になり、
      # 主題が3つ混ざってタイトルもサムネイルも1つしか表せなくなる。
      # 実際、最も見られた動画は単一主題のもので、情報を詰めたものほど
      # 視聴率が落ちていた。2本に分けて、それぞれ主題を1つにする。
      - name: Build and upload both shorts
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        run: |
          set +e
          # 定期実行では4本とも作る。手動実行では絞れるようにしてある。
          # 18:00の「現地での注目度」は2026-08-24に畳んだ。
          # 同じ試合をコメント欄の回が扱っていたので、そちらへ寄せた。
          # 1本だけ落ちた日に、成功した分まで上げ直すと重複するため。
          MODES="${{ inputs.modes }}"
          for mode in ${MODES:-players player voices press}; do
            echo "::group::$mode"
            if [ "$mode" = "players" ]; then
              VIDEO="build/morning/collespo_morning.mp4"
            else
              VIDEO="build/morning/collespo_morning_${mode}.mp4"
            fi

            python scripts/generate_morning_short.py \
              --recap data/morning_recap.json --mode "$mode" \
              --narration-out "build/mr_narration_${mode}.json"
            if [ ! -f "build/mr_narration_${mode}.json" ]; then
              echo "素材が無いため $mode は作りません"
              echo "::endgroup::"; continue
            fi

            # 原稿ができた時点で、常識で読み直す。
            #
            # ありえない数字が原稿に入っていたら、この1本だけ出さない。
            # 他の枠は別の材料で別の原稿を作っているので、巻き込まない。
            # 通し読み(--general)のほうは止めない。言語模型の違和感で
            # 正しい日の投稿を潰すと、その損のほうが大きい。
            if ! python scripts/sanity.py --general --strict \
                --narration "build/mr_narration_${mode}.json" \
                --out "data/sanity_${mode}.json"; then
              echo "::warning::$mode の原稿にありえない数字があるため出しません"
              echo "::endgroup::"; continue
            fi

            python scripts/synthesize_narration.py \
              --narration "build/mr_narration_${mode}.json" \
              --out-dir "build/mr_audio_${mode}"

            python scripts/generate_morning_short.py \
              --recap data/morning_recap.json --mode "$mode" \
              --audio-dir "build/mr_audio_${mode}" --out build/morning \
              --require-audio
            if [ $? -ne 0 ]; then
              echo "::warning::$mode の動画生成に失敗しました"
              echo "::endgroup::"; continue
            fi

            python scripts/generate_thumbnail.py \
              --kind "morning" --recap data/morning_recap.json \
              --mode "$mode" --out "build/morning/thumb_${mode}.png"

            # 公開時刻はYouTubeに預ける。3本を同じ数分間に出すと、
            # 登録者には通知が固まって届き、どれか1本しか見られない。
            # かといって本数分のcronを立てると、取得も失敗点も3倍になる。
            # 1回で作って、公開だけ散らす。
            #
            #   16:30 成績       最終試合の終了(実測14:25前後)から2時間。延長も吸収する
            #   17:00 今日の1人   選手名で検索する人に当たる。古くならない枠
            #   17:30 コメント欄   帰宅前。反応もので、いちばん軽く見られる
            #   18:00 注目度       帰宅前
            #   19:00 (日次MLB)    「毎日19時」の約束。ここは空けておく
            #   20:00 (サッカー)   欧州の試合前。ここも空けておく
            #   21:00 現地の報道   日本の視聴が最も多い20〜22時。読み物系は夜が合う
            case "$mode" in
              # 時系列で並べる。結果 → 結果への反応 → 明日の話題。
              #
              # 17:00 その日の結果(誰が活躍したか)
              # 18:00 その結果への反応(現地のコメントと報道)
              # 19:00 明日の話題(注目試合とサッカー。別のワークフロー)
              #
              # コメント欄を後ろに置いていたのは「遅いほど溜まる」と
              # 思っていたため。実測すると公開42分で中央値に達し、
              # 6.6時間を過ぎると1件も増えなかった。遅らせる意味が無い。
              players) AT="17:00" ;;
              player)  AT="17:00" ;;
              voices)  AT="18:00" ;;
              press)   AT="18:00" ;;
              *)       AT="" ;;
            esac

            # set +e で回しているため、ここが落ちても次のmodeへ進む。
            # 実際 --morning-mode の選択肢に press が無く、argparse が
            # 終了コード2で落ちていたのに誰も気づかず、現地の声の動画が
            # 2日ぶん作られては捨てられていた。結果を必ず出す。
            # 投稿済みの日は既定で飛ばす。消して作り直したい場合だけ
            # force を立てる(重複を防ぐ守りを、意図して外すための口)。
            FORCE=""
            if [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
            # 回によって使う材料が違う。既定値と同じ場所だが、
            # どの回が何を読むのかがここで分かるように明示しておく。
            #   voices → mlb_buzz(その日いちばん見られたハイライト)
            #   player → player_profile(今日の1人)
            if python scripts/upload_youtube.py \
              --video "$VIDEO" --kind morning --morning-mode "$mode" \
              --recap data/morning_recap.json \
              --buzz data/mlb_buzz.json \
              --profile data/player_profile.json \
              --thumbnail "build/morning/thumb_${mode}.png" \
              --privacy public --publish-at "$AT" $FORCE; then
              echo "$mode: 投稿しました (公開 ${AT:-即時})"
            else
              echo "::error::$mode の投稿に失敗しました"
            fi

            # TikTokへも同じものを出す。タイトルはYouTube側の記録から借りる。
            # 記録上の区分は players→morning / それ以外→morning_<mode>。
            if [ -n "$TIKTOK_REFRESH_TOKEN" ]; then
              if [ "$mode" = "players" ]; then TK=morning; else TK="morning_${mode}"; fi
              python scripts/post_tiktok.py --video "$VIDEO" --kind "$TK"
            fi
            echo "::endgroup::"

            # 以前はここで60秒空けていた。同時に公開すると初速が
            # 分散するためだったが、公開時刻をYouTubeに予約するように
            # したので、アップロードが何分に終わろうと公開は散る。
          done
          set -e

      - name: Add to playlists
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        # --sync は記録(11本)しか見ない。記録は4日間止まっていた
        # ことがあるので、チャンネルの投稿一覧から入れる。
        # 既に入っているものは飛ばすので、毎日回して問題ない。
        run: python scripts/playlists.py --backfill

      # 英語のタイトルと説明文を足す。日本語版は変えない。
      # 自動吹き替えで音声は英語になるが、タイトルが日本語のままだと
      # 英語圏の人はそこへ辿り着けない。視聴の35.8%が日本以外。
      - name: Add English metadata
        continue-on-error: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/localize_videos.py --recent 6

      # 結果はサイトからも参照できるよう、リポジトリへ残す
      - name: Commit recap
        if: always()
        run: |
          bash scripts/commit_data.sh \
            "recap: ${{ github.run_id }}" \
            data/morning_recap.json data/venue_stats.json data/published_videos.json data/mlb_buzz.json data/local_buzz.json data/published_tiktok.json data/local_reporters.json data/local_voices.json data/playlists.json data/localized.json data/recap_history data/best_of_day.json data/player_profile.json data/player_kana.json data/roster_stats.json data/featured_players.json

      - name: Save video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collespo-morning
          path: build/morning/collespo_morning.mp4
          retention-days: 7
          if-no-files-found: ignore
